<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>〖公司名〗〖这条片的名字〗</title>
<style>
/* 骨架：自己的内容只改三处：:root 里的颜色字体、舞台里的元素和它们的 data-in/data-out 时间、TOTAL 总秒数。
   下面的 <script> 引擎不要动：它按时间算每个元素的位置，所以任意一秒都能定格（网址后加 ?t=秒）。 */
:root{
  --bg:#0b1020; --bg2:#16224a; --ink:#f1ede4; --soft:#9fb0cc; --accent:#e0b862; --accent2:#5bd0c4;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#04060d}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;color:var(--ink);font-family:var(--sans);
  background:radial-gradient(ellipse at 50% 40%,var(--bg2) 0%,var(--bg) 62%,#04060d 100%)}
canvas{position:absolute;left:0;top:0}
.e{position:absolute;opacity:0;will-change:transform,opacity}      /* 每个会动的元素都带 class="e" 和 data-in */
.c{left:0;right:0;text-align:center}                               /* 居中的元素再加 class="c" */
.big{font-family:var(--serif);font-size:156px;font-weight:800;line-height:1.15;letter-spacing:.02em}
.mid{font-family:var(--serif);font-size:96px;font-weight:800;line-height:1.2}
.sub{font-size:44px;line-height:1.6;color:var(--soft);letter-spacing:.06em}
.tag{font-size:28px;letter-spacing:.4em;color:var(--accent)}
.hl{color:var(--accent);text-shadow:0 0 60px rgba(224,184,98,.45)}
.num small{font-size:110px;margin:0 0 0 22px;color:var(--ink);text-shadow:none}
.ring{width:760px;height:760px;left:580px;border:2px solid rgba(224,184,98,.35);border-radius:50%;box-shadow:0 0 120px rgba(224,184,98,.12) inset}
.num{font-family:var(--serif);font-size:360px;font-weight:800;line-height:1;color:var(--accent);text-shadow:0 0 80px rgba(224,184,98,.4)}
.chip{padding:30px 48px;border:2px solid rgba(224,184,98,.5);border-radius:90px;background:rgba(14,22,48,.78);font-size:50px;white-space:nowrap}
.chip small{display:block;font-size:26px;color:var(--soft);letter-spacing:.1em;margin-top:6px}
.card{width:480px;padding:48px 44px;border:1px solid rgba(255,255,255,.16);border-top:4px solid var(--accent);border-radius:10px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));box-shadow:0 30px 80px rgba(0,0,0,.35)}
.card b{display:block;font-family:var(--serif);font-size:110px;line-height:1;color:var(--accent)}
.card h3{font-family:var(--serif);font-size:52px;margin:22px 0 12px}
.card p{font-size:30px;line-height:1.6;color:var(--soft)}
.bar{height:56px;border-radius:6px;transform-origin:left}
.line{height:4px;background:var(--accent);transform-origin:left}
#ui{position:fixed;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.12);z-index:9}
#ui i{display:block;height:100%;width:0;background:var(--accent)}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9;color:rgba(255,255,255,.55);font:20px var(--sans);opacity:0;transition:opacity .4s}
</style>
</head>
<body>
<div id="stage">
<canvas id="bg" width="1920" height="1080"></canvas>

<!-- 下面是一个五幕的例子，共 24 秒。换成自己的内容：改字、改 data-in/data-out（单位秒）、增删元素。
     data-from 决定怎么进来：up 从下升起，left、right 从侧面滑入，scale 放大进来，blur 虚化变清晰，fade 只淡入。
     data-split="1" 让大字一个字一个字跳出来。data-count="数字" 让数字从 0 滚到它；数字后面要跟单位时，写成 <div class="e c num" data-in="…"><span data-count="30">0</span><small>多家</small></div>（年份、电话这类不要逗号的再加 data-plain="1"）。
     data-grow="x" 横向长出来（线、条形），data-delay 延后几秒。 -->

<!-- 第一幕 0 到 5 秒：开场大字 -->
<div class="e c tag" style="top:330px" data-in="0.3" data-out="4.6" data-from="fade">〖公司名〗</div>
<div class="e c big" style="top:410px" data-in="0.6" data-out="4.6" data-from="up" data-split="1">〖开场大字，<span class="hl">强调半句</span>〗</div>
<div class="e line" style="left:850px;top:640px;width:220px" data-in="1.8" data-out="4.6" data-grow="x"></div>
<div class="e c sub" style="top:690px" data-in="2.2" data-out="4.6" data-from="up">〖一句话说这条片讲什么〗</div>

<!-- 第二幕 5 到 12 秒：三个卖点依次飞入 -->
<div class="e c mid" style="top:150px" data-in="5.2" data-out="11.4" data-from="up">〖这一幕的大字〗</div>
<div class="e card" style="left:210px;top:420px" data-in="6.0" data-out="11.4" data-from="left"><b>1</b><h3>〖卖点名〗</h3><p>〖一句话〗</p></div>
<div class="e card" style="left:720px;top:420px" data-in="6.8" data-out="11.4" data-from="up"><b>2</b><h3>〖卖点名〗</h3><p>〖一句话〗</p></div>
<div class="e card" style="left:1230px;top:420px" data-in="7.6" data-out="11.4" data-from="right"><b>3</b><h3>〖卖点名〗</h3><p>〖一句话〗</p></div>

<!-- 第三幕 12 到 18 秒：一个大数字，必须是知识库写着的 -->
<div class="e c tag" style="top:230px" data-in="12.2" data-out="17.4" data-from="fade">〖这个数字是什么〗</div>
<div class="e c num" style="top:300px" data-in="12.4" data-out="17.4" data-from="scale" data-count="〖数字〗">0</div>
<div class="e c sub" style="top:700px" data-in="14.4" data-out="17.4" data-from="up">〖单位和一句说明〗</div>

<!-- 第四幕 18 到 22 秒：对比（左右各一条，长短就是差距） -->
<div class="e sub" style="left:320px;top:380px" data-in="18.2" data-out="22" data-from="left">〖以前〗</div>
<div class="e bar" style="left:320px;top:450px;width:1000px;background:#56627f" data-in="18.4" data-out="22" data-grow="x"></div>
<div class="e sub" style="left:320px;top:600px;color:var(--accent)" data-in="19.2" data-out="22" data-from="left">〖现在〗</div>
<div class="e bar" style="left:320px;top:670px;width:300px;background:var(--accent)" data-in="19.4" data-out="22" data-grow="x"></div>

<!-- 第五幕 22 到 26 秒：收尾，留到最后不消失（data-out 写总秒数） -->
<div class="e c big" style="top:380px" data-in="22.6" data-out="26" data-from="up" data-split="1">〖收尾大字〗</div>
<div class="e c sub" style="top:620px" data-in="23.6" data-out="26" data-from="up">〖落款：公司名；联系方式只写知识库里有的〗</div>
</div>

<div id="ui"><i></i></div>
<div id="hint">空格 暂停　R 重播　← → 前后跳 2 秒</div>

<script>
/* ---------- 引擎：不要动 ---------- */
const TOTAL=26, HOLD=2;                       // TOTAL：总秒数；片尾停 HOLD 秒再从头循环
const st=document.getElementById('stage'),cv=document.getElementById('bg'),cx=cv.getContext('2d');
const cl=x=>Math.max(0,Math.min(1,x)),seg=(t,a,b)=>cl((t-a)/(b-a));
const easeOut=x=>1-Math.pow(1-cl(x),3), easeBack=x=>{x=cl(x);const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform='translate('+(innerWidth-1920*s)/2+'px,'+(innerHeight-1080*s)/2+'px) scale('+s+')'}
addEventListener('resize',fit);fit();
const E=[...document.querySelectorAll('.e')].map(el=>{
  const cn=el.dataset.count?null:el.querySelector('[data-count]');   // 数字和单位放在同一个元素里时，data-count 写在里面的 <span> 上
  const o={el,a:parseFloat(el.dataset.in||0),b:parseFloat(el.dataset.out||TOTAL),from:el.dataset.from||'fade',grow:el.dataset.grow,count:(cn||el).dataset.count,cn,chars:null};
  if(el.dataset.split){const txt=el.innerHTML;el.innerHTML='';o.chars=[];
    const tmp=document.createElement('div');tmp.innerHTML=txt;
    (function walk(n,cls){n.childNodes.forEach(c=>{
      if(c.nodeType===3){[...c.textContent].forEach(ch=>{const s=document.createElement('span');s.textContent=ch;s.style.display='inline-block';s.style.opacity=0;if(cls)s.className=cls;el.appendChild(s);o.chars.push(s)})}
      else walk(c,c.className||cls)})})(tmp,'');}
  return o});
const FROM={up:p=>`translateY(${(1-p)*70}px)`,left:p=>`translateX(${(1-p)*-160}px)`,right:p=>`translateX(${(1-p)*160}px)`,scale:p=>`scale(${.7+.3*p})`,blur:p=>`scale(${1.04-.04*p})`,fade:p=>'none'};
function place(o,t){
  const p=easeOut(seg(t,o.a,o.a+.9)), q=seg(t,o.b-.5,o.b), alpha=o.b>=TOTAL?1:1-q;
  const op=(t<o.a?0:p)*alpha;
  const tr=(FROM[o.from]||FROM.fade)(p);
  if(o.chars){o.el.style.opacity=op>0?1:0;o.chars.forEach((s,i)=>{const k=easeBack(seg(t,o.a+i*.05,o.a+i*.05+.7));s.style.opacity=k>0?Math.min(1,k*1.5)*alpha:0;s.style.transform=`translateY(${(1-k)*80}px)`})}
  else{o.el.style.opacity=op;o.el.style.transform=o.grow?`scaleX(${easeOut(seg(t,o.a,o.a+1))})`:tr;
    if(o.from==='blur')o.el.style.filter=`blur(${(1-p)*18}px)`;}
  if(o.count){const to=parseFloat(String(o.count).replace(/,/g,''))||0,v=Math.round(to*easeOut(seg(t,o.a+.2,o.a+2.2)));const tg=o.cn||o.el;tg.textContent=tg.dataset.plain?String(v):v.toLocaleString()}
}
/* 背景：慢慢漂的光点，所有幕共用 */
const P=Array.from({length:90},(_,i)=>({x:(i*397)%1920,y:(i*211)%1080,r:1.5+(i%5),s:.15+(i%7)*.05,ph:i*1.7}));
function paint(t){cx.clearRect(0,0,1920,1080);
  P.forEach(d=>{const y=(d.y-t*d.s*60+1080*5)%1080,x=d.x+Math.sin(t*.3+d.ph)*40;
    cx.beginPath();cx.arc(x,y,d.r,0,6.283);cx.fillStyle=`rgba(224,184,98,${.12+.18*Math.sin(t+d.ph)**2})`;cx.fill()});
  const g=cx.createRadialGradient(960,540,0,960,540,700+60*Math.sin(t*.8));g.addColorStop(0,'rgba(91,208,196,.10)');g.addColorStop(1,'rgba(91,208,196,0)');
  cx.fillStyle=g;cx.fillRect(0,0,1920,1080)}
function render(t){paint(t);E.forEach(o=>place(o,t));document.querySelector('#ui i').style.width=(100*cl(t/TOTAL))+'%'}
/* 播放：?t=秒 定格；否则自动播放循环，空格暂停，R 重播，左右键跳 2 秒 */
const qs=new URLSearchParams(location.search);let cur=0,playing=true,last=performance.now();
if(qs.has('t')){render(parseFloat(qs.get('t'))||0);playing=false}
else{(function f(n){const dt=(n-last)/1000;last=n;if(playing)cur+=dt;if(cur>TOTAL+HOLD)cur=0;render(Math.min(cur,TOTAL));requestAnimationFrame(f)})(last)}
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();playing=!playing}
  if(e.key==='r'||e.key==='R')cur=0;if(e.key==='ArrowRight')cur=Math.min(TOTAL,cur+2);if(e.key==='ArrowLeft')cur=Math.max(0,cur-2);
  if(!qs.has('t')){const h=document.getElementById('hint');h.style.opacity=1;clearTimeout(window.__h);window.__h=setTimeout(()=>h.style.opacity=0,1800)}});
addEventListener('click',()=>{if(!qs.has('t'))playing=!playing});
</script>
</body>
</html>
