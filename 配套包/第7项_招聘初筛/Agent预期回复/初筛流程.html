<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>初筛流程</title><style>:root{
  --clay:#a94b3d;--clay-deep:#8d3a2e;--clay-soft:#f4e5e0;
  --paper:#f7f4eb;--paper-2:#ebe6d8;--card:#fffdf7;
  --ink:#171513;--muted:#5d554a;--soft:#8a7d6d;--line:#d8d0bf;
  --moss:#536944;--ocean:#285b74;--gold:#9b8238;
  --moss-soft:color-mix(in srgb,var(--moss) 14%,var(--card));
  --gold-soft:color-mix(in srgb,var(--gold) 16%,var(--card));
  --shadow-sm:0 2px 8px rgba(23,21,19,.05);--shadow:0 18px 50px rgba(23,21,19,.10);--shadow-lg:0 32px 80px rgba(23,21,19,.16);
  --font-serif:"Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
  --font-sans:"Inter","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --font-num:Georgia,"Times New Roman",serif;
  --font-mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
  --ease-out:cubic-bezier(0.22,1,0.36,1);--duration:200ms;
  /* 仿真软件界面用的中性色（真软件是白底灰线，不是纸面色；记入 gaps.log） */
  --ui-bg:#ffffff;--ui-side:#f6f6f3;--ui-line:#e4e2dc;--ui-text:#1f1f1d;--ui-sub:#6b6a66;--ui-faint:#a3a19b;--ui-hover:#efeee9;
  --ui-ok:#2f8f5b;--ui-ok-soft:#e5f3ea;--ui-warn:#b7791f;--ui-warn-soft:#fbf1dc;--ui-bad:#c2410c;--ui-bad-soft:#fde8e1;--ui-link:#2563a8;
}html,body{margin:0;background:#f6f6f3;font-family:var(--font-sans)}.wrap{padding:30px;display:grid;place-items:center}h1{font-size:22px;margin:0 0 24px;font-weight:700}
.u09cv{position:relative;margin:0 auto;font-family:var(--font-sans);color:var(--ui-text)}
.u09ns{position:absolute;inset:0}
.u09ns>*{position:absolute}
.u09n{background:#fff;border:1.5px solid var(--ui-line);border-radius:12px;box-shadow:var(--shadow-sm);padding:10px 12px 8px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.u09n b{font-size:19px;line-height:1.2}
.u09n p{margin:0;font-size:17px;color:var(--ui-sub);line-height:1.25}
.u09tg{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--ui-side);color:var(--ui-sub)}
.u09tg.tg-a{background:var(--ui-ok-soft);color:var(--ui-ok)}
.u09tg.tg-p{background:var(--ui-warn-soft);color:var(--ui-warn)}
.u09tg.tg-t{background:#e6eef9;color:var(--ui-link)}
.u09tg.tg-c{background:#e6f4e3;color:#3d7a35}
.u09e{height:3px;background:var(--ui-faint)}
.u09e::after{content:"";position:absolute;right:-1px;top:-5px;border-left:11px solid var(--ui-faint);border-top:6.5px solid transparent;border-bottom:6.5px solid transparent}
.u09ev{width:14px;background:linear-gradient(var(--ui-faint),var(--ui-faint)) center/3px 100% no-repeat}
.u09ev::before{content:"";position:absolute;left:0;top:-1px;border-bottom:11px solid var(--ui-faint);border-left:7px solid transparent;border-right:7px solid transparent}
.u09el{position:absolute;top:-30px;text-align:center;font-size:17px;color:var(--ui-sub);white-space:nowrap}
.u09cv .u09ev .u09el.v{top:50%;transform:translateY(-50%);left:auto;right:22px;text-align:right}
.u09dot{width:2px;background:repeating-linear-gradient(to bottom,var(--ui-faint) 0 4px,transparent 4px 9px)}
.u09tr{border:2px dashed var(--ui-line);border-radius:12px;background:rgba(255,255,255,.55)}
.u09tr span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:17px;color:var(--ui-sub);font-weight:600}
.u09tr.t-y{border-color:color-mix(in srgb,var(--ui-ok) 55%,#fff);background:var(--ui-ok-soft)}.u09tr.t-y span{color:var(--ui-ok)}
.u09tr.t-m{border-color:color-mix(in srgb,var(--ui-warn) 55%,#fff);background:var(--ui-warn-soft)}.u09tr.t-m span{color:var(--ui-warn)}
.u09chat{justify-content:center;gap:6px;background:#f3f9f1;border-color:#cfe5c9}
.u09chat b{font-size:17px}
/* 灯 */
.u09gate{border:2px solid var(--ui-warn);background:var(--ui-warn-soft)}
.u09lamp{width:14px;height:14px;border-radius:50%;background:var(--ui-faint);display:inline-block}
.u09gate b{color:#7a5410}
.u09gate p span{display:none}
.u09cv.idle .u09gate p .gi{display:inline}
.u09cv.bare .u09gate p .gi{display:inline}
.u09cv.done .u09gate p .gw,.u09cv.run .u09gate p .gw{display:inline}
.u09cv.ok .u09gate p .go{display:inline}.u09cv.ok .u09gate p .gw{display:none}
.u09cv.idle .u09gate{background:#fff;border-color:var(--ui-line)}
.u09cv.idle .u09gate b{color:var(--ui-text)}
.u09cv.done .u09lamp,.u09cv.run .u09lamp,.u09cv.bare .u09lamp{background:var(--ui-warn);box-shadow:0 0 0 4px rgba(183,121,31,.22);animation:u09lp 1.6s ease-in-out infinite}
.u09cv.ok .u09lamp{background:var(--ui-ok);box-shadow:0 0 0 4px rgba(47,143,91,.22);animation:none}
.u09cv.ok .u09gate{background:var(--ui-ok-soft);border-color:var(--ui-ok)}.u09cv.ok .u09gate b{color:#1f6b43}
@keyframes u09lp{50%{box-shadow:0 0 0 9px rgba(183,121,31,.05)}}
.u09 .chip{font-size:17px}
.u09 .fl-with{margin:12px 0 0;font-size:17px;color:var(--soft)}
/* 简历小纸片 */
.u09tk{position:absolute;inset:0;pointer-events:none}
.u09t{position:absolute;left:0;top:0;z-index:3;background:#fff;border:1.5px solid #cfcbc1;border-radius:4px;box-shadow:0 2px 6px rgba(23,21,19,.14);transform:translate(var(--x0),var(--y0));overflow:hidden;will-change:transform}
.u09t::after{content:"";position:absolute;left:18%;right:18%;top:42%;height:30%;background:repeating-linear-gradient(to bottom,#d9d5cb 0 2px,transparent 2px 6px)}
.u09t b{position:absolute;left:0;right:0;top:0;height:24%;background:var(--ui-faint);opacity:0}
.u09t.y b{background:var(--ui-ok)}.u09t.m b{background:var(--ui-warn)}.u09t.n b{background:#8b8a85}
.u09cv.run .u09t{animation:u09fly 1.05s cubic-bezier(.45,0,.25,1) calc(var(--i)*.075s) both}
.u09cv.run .u09t b{animation:u09bd .25s calc(var(--i)*.075s + .4s) both}
.u09cv.done .u09t,.u09cv.ok .u09t{transform:translate(var(--x3),var(--y3))}
.u09cv.done .u09t b,.u09cv.ok .u09t b{opacity:1}
.u09cv.ok .u09t.y{transform:translate(var(--x4),var(--y4));opacity:0;transition:transform .55s cubic-bezier(.5,0,.3,1) calc(var(--j)*.07s),opacity .15s calc(var(--j)*.07s + .42s)}
@keyframes u09fly{0%{transform:translate(var(--x0),var(--y0))}35%{transform:translate(var(--x1),var(--y1))}68%{transform:translate(var(--x2),var(--y2))}100%{transform:translate(var(--x3),var(--y3))}}
@keyframes u09bd{to{opacity:1}}
/* 开场里一直循环：停在黄灯前的样子是第一帧 */
.u09cv.loop .u09t{animation:u09loop 9s linear infinite;animation-delay:calc(var(--i)*.09s - 5s)}
.u09cv.loop .u09t b{animation:u09bl 9s linear infinite;animation-delay:calc(var(--i)*.09s - 5s)}
@keyframes u09loop{0%{transform:translate(var(--x0),var(--y0));opacity:0}2%{opacity:1}9%{transform:translate(var(--x0),var(--y0))}17%{transform:translate(var(--x1),var(--y1))}25%{transform:translate(var(--x2),var(--y2))}33%{transform:translate(var(--x3),var(--y3))}92%{transform:translate(var(--x3),var(--y3));opacity:1}97%{transform:translate(var(--x3),var(--y3));opacity:0}100%{transform:translate(var(--x0),var(--y0));opacity:0}}
@keyframes u09bl{0%,12%{opacity:0}19%,100%{opacity:1}}
