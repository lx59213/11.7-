<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>看板</title>
<style>
:root {
  --stage: #F4F5F8; --dots: #DCE0E8; --side: #FFFFFF; --line: #E3E6EC; --ink: #151922; --muted: #5C6475; --faint: #8D95A6;
  --edge: rgba(70,82,105,.20); --edge-dim: rgba(70,82,105,.06); --label: #2B3240; --halo: rgba(244,245,248,.92); --accent: #3B6FE0;
  --late: 220,53,69; --today: 234,94,10; --tmr: 196,138,0; --week: 52,92,214; --later: 120,128,145;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --stage: #0B0E14; --dots: #1A2030; --side: #11151D; --line: #222936; --ink: #E9ECF2; --muted: #A2AABA; --faint: #6B7385;
    --edge: rgba(170,185,210,.20); --edge-dim: rgba(170,185,210,.05); --label: #D5DBE6; --halo: rgba(11,14,20,.9); --accent: #7EA2FF;
    --late: 255,99,112; --today: 255,138,61; --tmr: 240,190,70; --week: 112,148,255; --later: 140,148,165;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
@media (min-width: 1700px) { html { font-size: 18px; } }
body { margin: 0; background: var(--stage); color: var(--ink); font: 1rem/1.6 var(--sans); overflow: hidden; }
a { color: inherit; }
.shell { display: flex; flex-direction: column; height: 100%; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 12px 22px; background: var(--side); border-bottom: 1px solid var(--line); }
h1 { display: inline; margin: 0 14px 0 0; font-size: 1.3rem; font-weight: 700; }
.sub { color: var(--muted); font-size: .88rem; }
.right { font-size: .82rem; color: var(--faint); }
.right a { margin-left: 14px; color: var(--muted); text-decoration: none; }
.right a:hover { color: var(--accent); }
.main { flex: 1; display: flex; min-height: 0; }
.stage { position: relative; flex: 1; min-width: 0; background-image: radial-gradient(var(--dots) 1px, transparent 1.2px); background-size: 22px 22px; }
canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }
.info { position: absolute; left: 18px; bottom: 16px; max-width: 70%; padding: 10px 14px; border-radius: 10px; background: var(--side); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.08); font-size: .9rem; pointer-events: none; }
.info b { font-size: 1rem; }
.info .m { color: var(--muted); font-size: .82rem; }
.hint { position: absolute; left: 18px; bottom: 16px; font-size: .8rem; color: var(--faint); pointer-events: none; }
.emptyg { position: absolute; left: 50%; top: 45%; width: 22em; max-width: 80%; transform: translate(-50%, -50%); text-align: center; color: var(--muted); line-height: 1.9; }
.side { flex: none; width: 350px; overflow-y: auto; background: var(--side); border-left: 1px solid var(--line); padding: 6px 20px 20px; }
.side section { padding: 14px 0 6px; border-bottom: 1px solid var(--line); }
.side section:last-of-type { border-bottom: 0; }
.side h2 { display: flex; align-items: baseline; margin: 0 0 8px; font-size: .95rem; font-weight: 700; }
.side h2 small { margin-left: auto; font-weight: 400; font-size: .78rem; color: var(--faint); }
.side ul { list-style: none; margin: 0; padding: 0; }
.side li { padding: 6px 8px; margin: 0 -8px; border-radius: 8px; font-size: .9rem; line-height: 1.55; }
.side li.hot:hover, .side li.on { background: var(--stage); }
.side .m { display: block; font-size: .78rem; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; margin: 0 -4px; }
.chip { display: inline-block; margin: 3px 4px; padding: 3px 10px 3px 8px; border: 1px solid var(--line); border-radius: 99px; font-size: .84rem; cursor: default; white-space: nowrap; }
.chip:hover, .chip.on { border-color: var(--faint); background: var(--stage); }
.chip b { font-weight: 600; margin-left: 4px; color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 50%; vertical-align: 0; }
.pg { color: var(--ink); text-decoration: none; }
.pg::after { content: " ↗"; color: var(--faint); font-size: .85em; }
.pg:hover { color: var(--accent); }
.deg { float: right; color: var(--faint); font-size: .8rem; }
.pill { display: inline-block; margin-right: 6px; padding: 0 7px; border-radius: 99px; font-size: .72rem; font-weight: 650; line-height: 1.7; color: rgb(var(--tone)); background: rgba(var(--tone),.14); vertical-align: 1px; white-space: nowrap; }
.who { color: rgb(var(--tmr)); font-weight: 600; }
.empty { margin: 0 0 8px; color: var(--faint); font-size: .88rem; }
.notice { margin: 40px auto; max-width: 640px; padding: 26px; border-radius: 12px; background: var(--side); border: 1px solid var(--line); font-size: 1.05rem; line-height: 1.9; }
.notice b { display: block; font-size: 1.2rem; }
.foot { padding: 7px 22px; background: var(--side); border-top: 1px solid var(--line); font-size: .78rem; color: var(--faint); text-align: center; }
@media (max-width: 900px) {
  body { overflow: auto; }
  .shell { height: auto; }
  .main { flex-direction: column; }
  .stage { flex: none; height: 70vh; }
  .side { width: auto; border-left: 0; border-top: 1px solid var(--line); }
}
/* 这两天做成的 */
.done { --glow: 59,111,224; }
.done .tl { display: flex; margin: 0; padding: 4px 6px 12px; list-style: none; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.done .st { position: relative; flex: none; display: flex; flex-direction: column; width: 210px; margin-right: 14px; }
.done .st.last { width: 320px; max-width: 80vw; margin-right: 0; }
.done .node { position: relative; display: block; height: 22px; }
.done .node::before { content: ""; position: absolute; left: 6px; right: -14px; top: 10px; height: 2px; background: var(--line); }
.done .st.last .node::before { display: none; }
.done .node i { position: absolute; left: 0; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--bc); box-shadow: 0 0 0 3px var(--side); }
.done .st.last .node i { top: 3px; width: 16px; height: 16px; box-shadow: 0 0 0 3px var(--side), 0 0 0 5px rgba(var(--glow), .25); }
.done .dn { display: flex; flex-direction: column; flex: 1; padding: 10px 12px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--stage); color: inherit; text-decoration: none;  }
.done a.dn { transition: border-color .15s, transform .15s; }
.done a.dn:hover { border-color: var(--bc); transform: translateY(-1px); }
.done .dk { display: flex; align-items: center; font-size: .76rem; line-height: 1.7; color: var(--muted); }
.done .dk .bd { flex: none; width: 8px; height: 8px; margin-right: 7px; border-radius: 2px; background: var(--bc); }
.done .dt { margin-top: 4px; font-size: .96rem; line-height: 1.45; font-weight: 650; color: var(--ink);  }
.done .dm { margin-top: 4px; font-size: .84rem; line-height: 1.55; color: var(--muted); }
.done .st.last .dn { padding: 14px 16px 16px; border: 2px solid var(--accent); background: var(--side); box-shadow: 0 8px 24px rgba(var(--glow), .16); }
.done .st.last a.dn:hover { border-color: var(--accent); }
.done .st.last .dk { font-size: .8rem; }
.done .st.last .dt { margin-top: 6px; font-size: 1.22rem; line-height: 1.4; }
.done .st.last .dm { margin-top: 6px; font-size: .92rem; color: var(--ink); }
.done .tag { margin-left: auto; padding: 0 9px; border-radius: 99px; font-style: normal; font-size: .74rem; font-weight: 650; line-height: 1.75; white-space: nowrap; color: var(--side); background: var(--accent); }
@keyframes doneIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes doneGlow { from { box-shadow: 0 0 0 0 rgba(var(--glow), .4); } to { box-shadow: 0 0 0 14px rgba(var(--glow), 0); } }
.done .st.fresh .dn { animation: doneIn .55s cubic-bezier(.2,.8,.2,1) both, doneGlow 1.3s ease-out .35s 1 both; }
@media (prefers-reduced-motion: reduce) { .done .st.fresh .dn { animation: none; } .done a.dn { transition: none; } }
@media (max-width: 560px) { .done .st { width: 200px; } .done .st.last { width: 290px; } }
.done { flex: none; display: flex; align-items: flex-start; padding: 10px 22px 0; background: var(--side); border-bottom: 1px solid var(--line); }
.done h2 { flex: none; width: 7.5em; margin: 4px 16px 0 0; font-size: .95rem; font-weight: 700; line-height: 1.5; }
.done h2 small { display: block; margin-top: 2px; font-weight: 400; font-size: .78rem; color: var(--faint); }
.done .tl { flex: 1; min-width: 0; padding-top: 0; padding-bottom: 10px; }
.done .st { width: 200px; }
.done .st.last { width: 300px; }
.done .dm { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.done .st.last .dm { -webkit-line-clamp: 3; }
@media (max-width: 900px) { .done { display: block; padding: 10px 16px 0; } .done h2 { display: flex; align-items: baseline; width: auto; margin: 0 0 6px; } .done h2 small { display: inline; margin: 0 0 0 auto; } }
/* 分数 */
.done .st.last { width: 340px; }
.done .st.last .dk { flex-wrap: wrap; }
.done .plus { margin-left: 6px; padding: 0 9px; border-radius: 99px; font-style: normal; font-size: .86rem; font-weight: 750; line-height: 1.7; white-space: nowrap; font-variant-numeric: tabular-nums; color: #fff; background: var(--bc); background: color-mix(in srgb, var(--bc) 80%, #000); }
.done .ds { margin-top: 6px; font-size: .8rem; font-weight: 650; line-height: 1.4; color: var(--muted); font-variant-numeric: tabular-nums; }
.done .ds b { font-size: .95rem; font-weight: 750; color: var(--ink); }
.done .st.last .ds { margin-top: 8px; font-size: .92rem; }
.done .st.last .ds b { font-size: 1.75rem; line-height: 1; }
.done .ds .sep { color: var(--faint); }
.done .tr { font-style: normal; font-weight: 700; color: var(--bc); color: color-mix(in srgb, var(--bc) 82%, var(--ink)); }
.done .dbar { display: block; height: 5px; margin-top: 8px; border-radius: 99px; background: rgba(128,128,128,.2); overflow: hidden; }
.done .dbar i { display: block; height: 100%; border-radius: inherit; background: var(--bc); transform-origin: left; }
.done .scs { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px 8px; margin: -4px 0 -4px auto; }
.done .scs + small { margin-left: 14px; }
.done .sc { display: inline-flex; align-items: baseline; padding: 3px 12px 4px 11px; border: 1px solid var(--bc); border-radius: 99px; font-size: .8rem; font-weight: 400; line-height: 1.3; white-space: nowrap; color: var(--muted); background: color-mix(in srgb, var(--bc) 9%, transparent); }
.done .sc .sb { margin-right: 6px; }
.done .sc .sn { font-size: 1.55rem; font-weight: 750; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.done .sc .su { margin-left: 2px; }
.done .sc .sd { margin: 0 5px; color: var(--faint); }
.done .sc .tr { font-size: .9rem; }
@keyframes plusPop { from { opacity: 0; transform: scale(.55); } 60% { opacity: 1; transform: scale(1.18); } to { opacity: 1; transform: none; } }
@keyframes barGrow { from { transform: scaleX(0); } to { transform: none; } }
@keyframes tierPop { 0% { transform: scale(1); background: transparent; } 30% { transform: scale(1.22); background: color-mix(in srgb, var(--bc) 30%, transparent); } 100% { transform: scale(1); background: transparent; } }
.done .st.fresh .plus { animation: plusPop .7s cubic-bezier(.2,.9,.3,1.2) .35s both; }
.done .st.fresh .dbar i { animation: barGrow .9s cubic-bezier(.2,.8,.2,1) .2s both; }
.done .tr.bump { display: inline-block; margin: 0 -4px; padding: 0 4px; border-radius: 6px; animation: tierPop .9s ease-out; }
@media (prefers-reduced-motion: reduce) { .done .st.fresh .plus, .done .st.fresh .dbar i, .done .tr.bump { animation: none; } }
@media (max-width: 560px) { .done .st.last { width: 300px; } }
.done .st.last { width: 320px; }
.done h2 { width: 11.5em; }
.done .scs { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 6px; margin: 8px 0 6px; }
.done .scs + small { margin-left: 0; }
@media (max-width: 900px) {
  .done h2 { width: auto; flex-wrap: wrap; }
  .done .scs { flex-direction: row; align-items: center; flex-wrap: wrap; order: 3; flex-basis: 100%; margin: 6px 0 2px; }
  .done .scs + small { order: 2; margin-left: auto; }
}
/* 进度卡：一个技能、一个智能体一张 */
#done .jd-lane { margin-top: 1.1em; }
#done .jd-lh { display: flex; align-items: center; gap: 8px; margin: 0 0 2px; }
#done .jd-lh .jd-kind { font-size: .86rem; padding: 1px 10px 1px 8px; }
#done .jd-lh .jd-kind svg { width: 15px; height: 15px; }
#done .jd-lh small { font-size: .82rem; color: var(--faint); }
#done .jd { display: flex; align-items: stretch; gap: 16px; margin: 0 -6px;  padding: 6px 6px 14px; list-style: none; overflow-x: auto; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
#done .jd-card { --ok: #3F8A4F; --part: #B07A12; --no: #B5483A; --c: var(--faint); flex: 0 0 360px; max-width: 82vw; scroll-snap-align: start; display: flex; flex-direction: column; padding: 14px 16px 12px; border-radius: 10px; border: 1px solid rgba(34,32,28,.16); border-top: 3px solid var(--c); background: var(--sheet); box-shadow: 0 1px 2px rgba(60,50,30,.06), 0 6px 18px rgba(60,50,30,.08); }
#done .jd-hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#done .jd-card.g0 { --c: #2F7D45; } #done .jd-card.g1 { --c: #2E78A8; } #done .jd-card.g2 { --c: #B07A12; } #done .jd-card.g3 { --c: #B5483A; }
#done .jd-kind { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px 0 6px; border-radius: 99px; background: var(--soft); color: var(--ink); font-size: .74rem; font-weight: 600; line-height: 1.7; }
#done .jd-kind svg { width: 13px; height: 13px; }
#done .jd-nm { display: block; margin-top: 0; font: 600 1.08rem/1.35 var(--serif); }
#done .jd-nm a { color: inherit; text-decoration: none; }
#done .jd-nm a:hover { text-decoration: underline; }
#done .jd-gd { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font: 700 1.25rem/1 var(--serif); cursor: help; }
#done .jd-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 12px; }
#done .jd-t { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 46px; padding: 4px 2px; border-radius: 5px; background: var(--soft); color: var(--faint); font-size: .72rem; line-height: 1.25; text-align: center; }
#done .jd-t b { font-size: .82rem; line-height: 1.2; }
#done .jd-t.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ink); } #done .jd-t.ok b { color: var(--ok); }
#done .jd-t.part { background: color-mix(in srgb, var(--part) 14%, transparent); color: var(--ink); } #done .jd-t.part b { color: var(--part); }
#done .jd-t.no { background: color-mix(in srgb, var(--no) 13%, transparent); color: var(--ink); } #done .jd-t.no b { color: var(--no); }
#done .jd-t.nx { background: transparent; border: 1.5px dashed var(--muted); color: var(--ink); }
#done .jd-t.nx b { font-size: .68rem; font-weight: 600; }
#done .jd-t.skip b { font-size: .66rem; font-weight: 400; }
#done .jd-why { margin: 10px 0 0; font-size: .86rem; line-height: 1.55; color: var(--muted); }
#done .jd-new { animation: jdPop 1.2s cubic-bezier(.2,.8,.2,1) both; }
@keyframes jdPop { 0% { transform: scale(.6); opacity: 0; } 50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 30%, transparent); } 100% { transform: none; box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { #done .jd-new { animation: none; } }
@media (prefers-color-scheme: dark) { #done .jd-card { --ok: #7BC487; --part: #E2B25A; --no: #EC8C77; border-color: rgba(255,255,255,.14); box-shadow: none; } #done .jd-card.g0 { --c: #4E9F62; } #done .jd-card.g1 { --c: #4C93C2; } #done .jd-card.g2 { --c: #C08A22; } #done .jd-card.g3 { --c: #C85A4A; } }
@media (max-width: 560px) { #done .jd-card { flex-basis: 300px; } }
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div><h1 id="title">看板</h1><span class="sub" id="sub"></span></div>
    <div class="right"><span id="stamp"></span><span id="home"></span></div>
  </header>
  <div class="notice" id="notice" hidden></div>
  <div class="done" id="done" hidden></div>
  <div class="main" id="app" hidden>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hint" id="hint">点一下圆点，在 Obsidian 里打开那一页。按住圆点可以拖开。</div>
      <div class="info" id="info" hidden></div>
      <div class="emptyg" id="emptyg" hidden>还没有页和页连着的关系。<br>整理好的页多了，跟 AI 说“更新看板”。</div>
    </div>
    <aside class="side" id="side"></aside>
  </div>
  <footer class="foot">数据是 AI 整理时写的。想看最新的，跟 AI 说‘更新看板’。</footer>
</div>
<script>
(function () {
  'use strict';
  var DEMO = /[?&#]demo\b/.test(location.search + location.hash);
  var FILE = DEMO ? '看板数据_示例.js' : '看板数据.js';
  var WEEK = '日一二三四五六';
  var D = null, SIG = '', DAY = '';

  function arr(v) { return Array.isArray(v) ? v : []; }
  function txt(v) { return v == null || typeof v === 'object' ? '' : String(v).trim(); }
  function esc(v) { return txt(v).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function cleanPath(p) { return txt(p).replace(/\\/g, '/').replace(/^\.?\/+/, ''); }
  function pageName(p) { var s = cleanPath(p).replace(/\.md$/i, ''); return s.slice(s.lastIndexOf('/') + 1); }
  function pageHref(p) {
    return 'obsidian://open?vault=' + encodeURIComponent(txt(D && D.库文件夹) || '知识库') +
      '&file=' + encodeURIComponent(cleanPath(p).replace(/\.md$/i, ''));
  }
  function pageLink(p, label, cls) {
    var name = txt(label) || pageName(p);
    if (!cleanPath(p)) return name ? '<span class="' + (cls || 'pg') + '">' + esc(name) + '</span>' : '';
    return '<a class="' + (cls || 'pg') + '" href="' + esc(pageHref(p)) + '" title="在 Obsidian 里打开">' + esc(name) + '</a>';
  }
  function day(v) { var m = /(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(txt(v)); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }
  function today() {
    var u = DEMO && D && day(D.更新);
    if (u) return u;
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function diff(d) { return Math.round((d - today()) / 864e5); }
  function md(d) { return (d.getFullYear() !== today().getFullYear() ? d.getFullYear() + '年' : '') + (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  function wk(d) { return '周' + WEEK.charAt(d.getDay()); }
  function due(v) {
    var d = day(v);
    if (!d) return { k: 'none', n: 1e4, t: txt(v) || '没写哪天' };
    var n = diff(d);
    var k = n < 0 ? 'late' : n === 0 ? 'today' : n === 1 ? 'tmr' : n <= 7 ? 'week' : 'later';
    var t = k === 'late' ? '过了 ' + -n + ' 天' : k === 'today' ? '今天' : k === 'tmr' ? '明天' : k === 'week' ? wk(d) + ' · ' + n + ' 天后' : md(d);
    return { k: k, n: n, d: d, t: t };
  }
  function todos() {
    return arr(D.待办).map(function (x, i) { x = x || {}; return { 事: txt(x.事), 页: x.页, due: due(x.哪天), i: i }; })
      .filter(function (x) { return x.事; })
      .sort(function (a, b) { return a.due.n - b.due.n || a.i - b.i; });
  }
  function items(list, key) { return arr(list).filter(function (x) { return x && txt(x[key]); }); }
  function stamp() {
    var u = txt(D.更新), d = day(u);
    if (!d) return u ? '更新于 ' + u : '';
    var t = /(\d{1,2})[:：](\d{2})/.exec(u), ago = -diff(d);
    return '更新于 ' + md(d) + ' ' + wk(d) + (t ? ' ' + t[1] + ':' + t[2] : '') + (ago > 0 ? '（' + ago + ' 天前）' : '');
  }
  function put(id, html) { var el = document.getElementById(id); el.innerHTML = html || ''; el.hidden = !html; }

  function load(first) {
    var prev = window.KANBAN, old = document.getElementById('kanban-data'), s = document.createElement('script');
    window.KANBAN = undefined;

    var weak = ks.filter(function (k) { return resultOf(c.step[k]) !== 'ok'; });
    if (!weak.length) return ks.length > 1 ? '做过的 ' + ks.length + ' 步都做到了' : '这一步做到了';
    // 先说没做到的，再说差一点的，最多两句
    var said = weak.filter(function (k) { return resultOf(c.step[k]) === 'no'; })
      .concat(weak.filter(function (k) { return resultOf(c.step[k]) === 'part'; }))
      .map(function (k) { return txt(c.step[k].实话); }).filter(Boolean).slice(0, 2);
    return '差在第 ' + weak.join('、') + ' 步' + (said.length ? '：' + said.join('；') : '');
  }
  function stageCard(c, isNew) {
    if (c.plain) {
      var x = c.plain, kind = txt(x.块) || '成果';
      return '<li class="jd-card"><div class="jd-hd"><div>' +
        '<b class="jd-nm">' + (cleanPath(x.页) ? '<a href="' + esc(pageHref(x.页)) + '">' + esc(x.名) + '</a>' : esc(x.名)) + '</b></div></div>' +
        (txt(x.意味着) ? '<p class="jd-why">' + esc(x.意味着) + '</p>' : '') + '</li>';
    }
    var names = STEPS[c.kind], max = Math.max.apply(null, Object.keys(c.step).map(Number)), tiles = '';
    for (var i = 1; i <= names.length; i++) {
      var x = c.step[i], cls = 'jd-t', mark = '';
      if (x) { var r = resultOf(x); cls += ' ' + r; mark = { ok: '✓', part: '!', no: '✕' }[r]; if (isNew && i === c.last) cls += ' jd-new'; }
      else if (i === max + 1) { cls += ' nx'; mark = '下一步'; }
      else if (i < max) { cls += ' skip'; mark = '没做'; }
      tiles += '<span class="' + cls + '" title="第 ' + i + ' 步"><b>' + mark + '</b>' + esc(names[i - 1]) + '</span>';
    }
    var name = esc(pageName(c.page));
    var title = cleanPath(c.page) ? '<a href="' + esc(pageHref(c.page)) + '" title="在 Obsidian 里打开">' + name + '</a>' : name;
    var g = gradeOf(c);
    // 卡上的颜色只表示好坏：优、良、中、差各一种；技能还是智能体看这一行的标签
    return '<li class="jd-card g' + '优良中差'.indexOf(g) + '">' +
      '<div class="jd-hd"><div>' + '<b class="jd-nm">' + title + '</b></div><span class="jd-gd" title="' + GRADE_TIP + '">' + g + '</span></div>' +
      '<div class="jd-tiles" style="--n:' + names.length + '">' + tiles + '</div>' +
      '<p class="jd-why">' + esc(whyOf(c)) + '</p></li>';
  }
  function doneBlock() {
    var raw = Array.isArray(D.成果) ? D.成果 : [], cards = stageCards(raw);
    if (!cards.length) { doneLast = ''; return ''; }
    var end = raw[raw.length - 1] || {}, sig = [end.块, end.步, end.更新, end.结果, raw.length].map(txt).join('|');
    doneFresh = sig !== doneLast && !doneFirst;
    doneFirst = false;
    doneLast = sig;
    // 知识库、技能、智能体各一行，不混在一起；每行最近做的在最左，多了往右滑
    var lanes = [], seen = {};
    cards.forEach(function (c) { var k = c.kind || '成果'; if (!seen[k]) { seen[k] = []; lanes.push(k); } seen[k].push(c); });
    var newest = cards.reduce(function (m, c) { return c.at > m.at ? c : m; }, cards[0]);
    return '<h2>这两天做成的<small>共 ' + cards.length + ' 样</small></h2>' + lanes.map(function (k) {
      var list = seen[k].slice().sort(function (a, b) { return b.at - a.at; });
      return '<div class="jd-lane"><p class="jd-lh">' + kindTag(k) + '<small>' + list.length + ' 个</small></p><ol class="jd">' +
        list.map(function (c) { return stageCard(c, c === newest && doneFresh); }).join('') + '</ol></div>';
    }).join('');
  }
  function scoreTick(still) {
    Array.prototype.forEach.call(document.querySelectorAll('#done .sc'), function (el) {
      var b = el.getAttribute('data-b'), to = Number(el.getAttribute('data-to')), tier = el.getAttribute('data-tier');
      var seen = scoreSeen[b], num = el.querySelector('.sn'), tr = el.querySelector('.tr');
      scoreSeen[b] = { n: to, tier: tier };
      if (!seen || still) return;
      if (tr && seen.tier !== tier) tr.className += ' bump';
      if (seen.n === to) return;
      var from = seen.n, t0 = null;
      num.textContent = from;
      var step = function (t) {
        if (t0 == null) t0 = t;
        var k = Math.min(1, (t - t0) / 800);
        num.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }
  function doneShow() {
    put('done', doneBlock());
    if (!document.querySelector('#done .tl')) return;
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var smooth = doneFresh && !doneFirst && !still;
    doneFirst = false;
    scoreTick(still);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var tl = document.querySelector('#done .tl');
        if (!tl) return;
        var left = tl.scrollWidth - tl.clientWidth;
        if (smooth && tl.scrollTo) tl.scrollTo({ left: left, behavior: 'smooth' }); else tl.scrollLeft = left;
      });
    });
  }

  function render() {
    var name = txt(D.库名) || '我的知识库';
    document.title = name + ' · 看板';
    doneShow();
    put('title', esc(name));
    put('sub', esc([txt(D.谁), txt(D.岗位), txt(D.业务)].filter(Boolean).join(' · ')));
    put('stamp', esc(stamp()));
    put('home', pageLink('首页.md', '在 Obsidian 里打开首页 ↗', 'home'));
    readColors();
    build();
    document.getElementById('emptyg').hidden = G.nodes.length > 0;
    document.getElementById('hint').hidden = !G.nodes.length;
    side.innerHTML = sidebar(todos());
  }

  window.addEventListener('resize', function () { if (!D) return; G.fit = true; fitView(true); draw(); });
  var mq = window.matchMedia && matchMedia('(prefers-color-scheme: dark)');
  if (mq) (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(function () { readColors(); draw(); });

  load(true);
  setInterval(function () { load(false); }, 30000);
})();
</script>
</body>
