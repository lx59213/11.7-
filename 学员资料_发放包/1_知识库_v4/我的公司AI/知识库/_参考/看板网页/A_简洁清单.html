<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>看板</title>
<style>
:root {
  --desk: #EEEBE4; --sheet: #FFFEFB; --ink: #22201C; --muted: #69635A; --faint: #9A9388;
  --rule: #E7E2D8; --soft: #F6F3EC; --accent: #AE4536; --accent-soft: #F7E7E3;
  --shadow: 0 1px 2px rgba(60,50,30,.06), 0 12px 40px rgba(60,50,30,.08);
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --desk: #121110; --sheet: #1B1A18; --ink: #ECE8E1; --muted: #ABA498; --faint: #7D776C;
    --rule: #302E29; --soft: #23211E; --accent: #EC8C77; --accent-soft: #3A2622;
    --shadow: 0 0 0 1px #2A2824, 0 12px 40px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
@media (min-width: 1280px) { html { font-size: 17px; } }
@media (min-width: 1700px) { html { font-size: 18px; } }
body { margin: 0; background: var(--desk); color: var(--ink); font: 1rem/1.7 var(--sans); }
a { color: inherit; }
.sheet { max-width: 940px; margin: 40px auto; padding: 56px 72px 36px; background: var(--sheet); border-radius: 6px; box-shadow: var(--shadow); }
.who { margin: 0; font-size: .875rem; letter-spacing: .08em; color: var(--muted); }
h1 { margin: .2em 0 .15em; font: 600 2.15rem/1.25 var(--serif); letter-spacing: .02em; }
.biz { margin: 0; color: var(--muted); font-size: 1.02rem; }
.stamp { display: flex; flex-wrap: wrap; justify-content: space-between; margin: 1.4em 0 0; padding-top: .9em; border-top: 1px solid var(--rule); font-size: .82rem; color: var(--faint); }
.stamp a { color: var(--muted); text-decoration: none; }
.stamp a:hover { color: var(--accent); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); margin: 1.8em 0 0; padding: 0; }
.facts div { display: flex; flex-direction: column-reverse; justify-content: flex-end; padding: .1em 0 .1em 1em; border-left: 1px solid var(--rule); }
.facts div:first-child { padding-left: 0; border-left: 0; }
.facts dd { margin: 0; font: 600 1.9rem/1.2 var(--serif); font-variant-numeric: tabular-nums; }
.facts dt { font-size: .8rem; color: var(--muted); }
.lead { margin: 1.8em 0 0; padding: 1em 1.25em; background: var(--soft); border-radius: 8px; font: 1.12rem/1.8 var(--serif); }
.lead b { color: var(--accent); font-weight: 600; padding: 0 .1em; }
section { margin-top: 2.6em; }
h2 { display: flex; align-items: baseline; margin: 0 0 .35em; padding-bottom: .5em; border-bottom: 1.5px solid var(--ink); font: 600 1.2rem/1.4 var(--serif); }
h2 .no { color: var(--accent); margin-right: .7em; }
h2 small { margin-left: auto; font: .82rem var(--sans); color: var(--faint); }
ul { list-style: none; margin: 0; padding: 0; }
.group { margin: 1.15em 0 .2em; font-size: .8rem; letter-spacing: .1em; color: var(--muted); }
.group em { font-style: normal; color: var(--faint); letter-spacing: 0; margin-left: .8em; }
.group.late { color: var(--accent); }
.todo { display: grid; grid-template-columns: 1.6em 1fr auto; grid-column-gap: .5em; padding: .7em 0; border-bottom: 1px solid var(--rule); }
.todo .box { width: .95em; height: .95em; margin-top: .42em; border: 1.5px solid var(--faint); border-radius: 50%; }
.todo.late .box { border-color: var(--accent); background: var(--accent-soft); }
.t { margin: 0; font-size: 1.04rem; line-height: 1.6; }
.meta { margin: .2em 0 0; font-size: .84rem; color: var(--muted); }
.meta .sep { color: var(--faint); margin: 0 .5em; }
.pg { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule); transition: color .15s, border-color .15s; }
.pg::after { content: " ↗"; font-size: .85em; color: var(--faint); }
.pg:hover { color: var(--accent); border-color: var(--accent); }
.pill { align-self: start; margin-top: .25em; padding: 0 .6em; border-radius: 99px; font-size: .78rem; line-height: 1.7; white-space: nowrap; color: var(--accent); background: var(--accent-soft); }
.later li { display: grid; grid-template-columns: 7.2em 1fr; grid-column-gap: 1em; padding: .5em 0; border-bottom: 1px dashed var(--rule); font-size: .92rem; color: var(--muted); }
.later .d { font-variant-numeric: tabular-nums; color: var(--faint); }
.ask { padding: .8em 0 .8em 1em; border-bottom: 1px solid var(--rule); border-left: 2px solid var(--accent); margin-top: .5em; }
.who-tag { color: var(--ink); font-weight: 600; }
.miss li { display: grid; grid-template-columns: 1fr auto; grid-column-gap: 1.5em; padding: .6em 0; border-bottom: 1px solid var(--rule); }
.miss .t { font-size: .98rem; }
.miss .t::before { content: "—"; color: var(--faint); margin-right: .6em; }
.miss .meta { margin: 0; text-align: right; white-space: nowrap; }
.recent li { display: grid; grid-template-columns: 1fr auto; grid-column-gap: 1.5em; padding: .7em 0; border-bottom: 1px solid var(--rule); }
.recent .name { font-weight: 600; font-size: 1rem; }
.recent .name .pg { color: var(--ink); }
.recent .blk { margin-left: .7em; font-size: .78rem; color: var(--faint); }
.recent .d { font-size: .82rem; color: var(--faint); white-space: nowrap; padding-top: .2em; }
.empty { margin: .9em 0 0; color: var(--faint); font-size: .95rem; }
.lib p { margin: .8em 0 0; }
.lib .blocks span { display: inline-block; margin: 0 1.4em .2em 0; white-space: nowrap; }
.lib .blocks b { font: 600 1.05rem var(--serif); margin-left: .25em; }
.lib .todo-raw a { margin-right: .9em; }
.notice { margin: 2.4em 0 0; padding: 1.4em 1.5em; border-radius: 8px; background: var(--soft); font-size: 1.05rem; line-height: 1.9; }
.notice b { display: block; font: 600 1.15rem var(--serif); }
.foot { margin-top: 3em; padding-top: 1em; border-top: 1px solid var(--rule); font-size: .82rem; color: var(--faint); text-align: center; }
@media (max-width: 960px) { .sheet { margin: 0 auto; padding: 40px 28px 28px; border-radius: 0; box-shadow: none; } }
@media (max-width: 560px) { .later li, .miss li, .recent li { grid-template-columns: 1fr; } .miss .meta { text-align: left; } h1 { font-size: 1.8rem; } }
/* 这两天做成的 */
.done { --glow: 174,69,54; }
.done .tl { display: flex; margin: 0; padding: 4px 6px 12px; list-style: none; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.done .st { position: relative; flex: none; display: flex; flex-direction: column; width: 210px; margin-right: 14px; }
.done .st.last { width: 320px; max-width: 80vw; margin-right: 0; }
.done .node { position: relative; display: block; height: 22px; }
.done .node::before { content: ""; position: absolute; left: 6px; right: -14px; top: 10px; height: 2px; background: var(--rule); }
.done .st.last .node::before { display: none; }
.done .node i { position: absolute; left: 0; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--bc); box-shadow: 0 0 0 3px var(--sheet); }
.done .st.last .node i { top: 3px; width: 16px; height: 16px; box-shadow: 0 0 0 3px var(--sheet), 0 0 0 5px rgba(var(--glow), .25); }
.done .dn { display: flex; flex-direction: column; flex: 1; padding: 10px 12px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--soft); color: inherit; text-decoration: none;  }
.done a.dn { transition: border-color .15s, transform .15s; }
.done a.dn:hover { border-color: var(--bc); transform: translateY(-1px); }
.done .dk { display: flex; align-items: center; font-size: .76rem; line-height: 1.7; color: var(--muted); }
.done .dk .bd { flex: none; width: 8px; height: 8px; margin-right: 7px; border-radius: 2px; background: var(--bc); }
.done .dt { margin-top: 4px; font-size: .96rem; line-height: 1.45; font-weight: 650; color: var(--ink); font-family: var(--serif); font-weight: 600; }
.done .dm { margin-top: 4px; font-size: .84rem; line-height: 1.55; color: var(--muted); }
.done .st.last .dn { padding: 14px 16px 16px; border: 2px solid var(--accent); background: var(--accent-soft); box-shadow: 0 8px 24px rgba(var(--glow), .16); }
.done .st.last a.dn:hover { border-color: var(--accent); }
.done .st.last .dk { font-size: .8rem; }
.done .st.last .dt { margin-top: 6px; font-size: 1.22rem; line-height: 1.4; }
.done .st.last .dm { margin-top: 6px; font-size: .92rem; color: var(--ink); }
.done .tag { margin-left: auto; padding: 0 9px; border-radius: 99px; font-style: normal; font-size: .74rem; font-weight: 650; line-height: 1.75; white-space: nowrap; color: var(--sheet); background: var(--accent); }
@keyframes doneIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes doneGlow { from { box-shadow: 0 0 0 0 rgba(var(--glow), .4); } to { box-shadow: 0 0 0 14px rgba(var(--glow), 0); } }
.done .st.fresh .dn { animation: doneIn .55s cubic-bezier(.2,.8,.2,1) both, doneGlow 1.3s ease-out .35s 1 both; }
@media (prefers-reduced-motion: reduce) { .done .st.fresh .dn { animation: none; } .done a.dn { transition: none; } }
@media (max-width: 560px) { .done .st { width: 200px; } .done .st.last { width: 290px; } }
.done { margin-top: 1.8em; }
.done h2 { margin-bottom: .2em; }
.done .tl { margin-top: .9em; }
/* 分数 */
.done .st.last { width: 340px; }
.done .st.last .dk { flex-wrap: wrap; }
.done .plus { margin-left: 6px; padding: 0 9px; border-radius: 99px; font-style: normal; font-size: .86rem; font-weight: 750; line-height: 1.7; white-space: nowrap; font-variant-numeric: tabular-nums; color: #fff; background: var(--bc); background: color-mix(in srgb, var(--bc) 80%, #000); }
.done .ds { margin-top: 6px; font-size: .8rem; font-weight: 650; line-height: 1.4; color: var(--muted); font-variant-numeric: tabular-nums; }
.done .ds b { font-size: .95rem; font-weight: 750; color: var(--ink); }
.done .st.last .ds { margin-top: 8px; font-size: .92rem; }
.done .st.last .ds b { font-size: 1.75rem; line-height: 1; }
.done .ds .sep { color: var(--faint); }
.done .tr { font-style: normal; font-weight: 700; color: var(--bc); color: color-mix(in srgb, var(--bc) 82%, var(--ink)); }
.done .dbar { display: block; height: 5px; margin-top: 8px; border-radius: 99px; background: rgba(128,128,128,.2); overflow: hidden; }
.done .dbar i { display: block; height: 100%; border-radius: inherit; background: var(--bc); transform-origin: left; }
.done .scs { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px 8px; margin: -4px 0 -4px auto; }
.done .scs + small { margin-left: 14px; }
.done .sc { display: inline-flex; align-items: baseline; padding: 3px 12px 4px 11px; border: 1px solid var(--bc); border-radius: 99px; font-size: .8rem; font-weight: 400; line-height: 1.3; white-space: nowrap; color: var(--muted); background: color-mix(in srgb, var(--bc) 9%, transparent); }
.done .sc .sb { margin-right: 6px; }
.done .sc .sn { font-size: 1.55rem; font-weight: 750; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.done .sc .su { margin-left: 2px; }
.done .sc .sd { margin: 0 5px; color: var(--faint); }
.done .sc .tr { font-size: .9rem; }
@keyframes plusPop { from { opacity: 0; transform: scale(.55); } 60% { opacity: 1; transform: scale(1.18); } to { opacity: 1; transform: none; } }
@keyframes barGrow { from { transform: scaleX(0); } to { transform: none; } }
@keyframes tierPop { 0% { transform: scale(1); background: transparent; } 30% { transform: scale(1.22); background: color-mix(in srgb, var(--bc) 30%, transparent); } 100% { transform: scale(1); background: transparent; } }
.done .st.fresh .plus { animation: plusPop .7s cubic-bezier(.2,.9,.3,1.2) .35s both; }
.done .st.fresh .dbar i { animation: barGrow .9s cubic-bezier(.2,.8,.2,1) .2s both; }
.done .tr.bump { display: inline-block; margin: 0 -4px; padding: 0 4px; border-radius: 6px; animation: tierPop .9s ease-out; }
@media (prefers-reduced-motion: reduce) { .done .st.fresh .plus, .done .st.fresh .dbar i, .done .tr.bump { animation: none; } }
@media (max-width: 560px) {
  .done .st.last { width: 300px; }
  .done h2 { flex-wrap: wrap; }
  .done .scs { order: 3; flex-basis: 100%; justify-content: flex-start; margin: 8px 0 2px; }
  .done .scs + small { order: 2; margin-left: auto; }
}
</style>
</head>
<body>
<main class="sheet">
  <header>
    <p class="who" id="who"></p>
    <h1 id="title">看板</h1>
    <p class="biz" id="biz"></p>
    <p class="stamp"><span id="stamp"></span><span id="home"></span></p>
  </header>
  <div class="notice" id="notice" hidden></div>
  <div id="app" hidden>
    <div class="done" id="done" hidden></div>
    <dl class="facts" id="facts"></dl>
    <p class="lead" id="lead"></p>
    <div id="sections"></div>
  </div>
  <footer class="foot">数据是 AI 整理时写的。想看最新的，跟 AI 说‘更新看板’。</footer>
</main>
<script>
(function () {
  'use strict';
  var DEMO = /[?&#]demo\b/.test(location.search + location.hash);
  var FILE = DEMO ? '看板数据_示例.js' : '看板数据.js';
  var WEEK = '日一二三四五六';
  var D = null, SIG = '', DAY = '';

  function arr(v) { return Array.isArray(v) ? v : []; }
  function txt(v) { return v == null || typeof v === 'object' ? '' : String(v).trim(); }
  function esc(v) { return txt(v).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function cleanPath(p) { return txt(p).replace(/\\/g, '/').replace(/^\.?\/+/, ''); }
  function pageName(p) { var s = cleanPath(p).replace(/\.md$/i, ''); return s.slice(s.lastIndexOf('/') + 1); }
  function pageHref(p) {
    return 'obsidian://open?vault=' + encodeURIComponent(txt(D && D.库文件夹) || '知识库') +
      '&file=' + encodeURIComponent(cleanPath(p).replace(/\.md$/i, ''));
  }
  function pageLink(p, label, cls) {
    var name = txt(label) || pageName(p);
    if (!cleanPath(p)) return name ? '<span class="' + (cls || 'pg') + '">' + esc(name) + '</span>' : '';
    return '<a class="' + (cls || 'pg') + '" href="' + esc(pageHref(p)) + '" title="在 Obsidian 里打开">' + esc(name) + '</a>';
  }
  function yes(v) { return v === true || /^(是|对|有|整理了|已整理|好了|✓|true|yes)$/i.test(txt(v)); }
  function day(v) { var m = /(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(txt(v)); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }
  function today() {
    var u = DEMO && D && day(D.更新);
    if (u) return u;
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function diff(d) { return Math.round((d - today()) / 864e5); }
  function md(d) { return (d.getFullYear() !== today().getFullYear() ? d.getFullYear() + '年' : '') + (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  function wk(d) { return '周' + WEEK.charAt(d.getDay()); }
  function due(v) {
    var d = day(v);
    if (!d) return { k: 'none', n: 1e4, t: txt(v) || '没写哪天' };
    var n = diff(d);
    var k = n < 0 ? 'late' : n === 0 ? 'today' : n === 1 ? 'tmr' : n <= 7 ? 'week' : 'later';
    var t = k === 'late' ? '过了 ' + -n + ' 天' : k === 'today' ? '今天' : k === 'tmr' ? '明天' : k === 'week' ? wk(d) + ' · ' + n + ' 天后' : md(d);
    return { k: k, n: n, d: d, t: t };
  }
  function todos() {
    return arr(D.待办).map(function (x, i) { x = x || {}; return { 事: txt(x.事), 页: x.页, due: due(x.哪天), i: i }; })
      .filter(function (x) { return x.事; })
      .sort(function (a, b) { return a.due.n - b.due.n || a.i - b.i; });
  }
  function items(list, key) { return arr(list).filter(function (x) { return x && txt(x[key]); }); }
  function stamp() {
    var u = txt(D.更新), d = day(u);
    if (!d) return u ? '更新于 ' + u : '';
    var t = /(\d{1,2})[:：](\d{2})/.exec(u), ago = -diff(d);
    return '更新于 ' + md(d) + ' ' + wk(d) + (t ? ' ' + t[1] + ':' + t[2] : '') + (ago > 0 ? '（' + ago + ' 天前）' : '');
  }
  function numbers() {
    var n = D.数字;
    if (n && !Array.isArray(n) && typeof n === 'object') n = Object.keys(n).map(function (k) { return { 名: k, 数: n[k] }; });
    return arr(n).filter(function (x) { return x && txt(x.名); });
  }
  function put(id, html) { var el = document.getElementById(id); el.innerHTML = html || ''; el.hidden = !html; }

  function load(first) {
    var prev = window.KANBAN, old = document.getElementById('kanban-data'), s = document.createElement('script');
    window.KANBAN = undefined;
    if (old) old.parentNode.removeChild(old);
    s.id = 'kanban-data';
    s.src = FILE + (first ? '' : '?v=' + Date.now());
    s.onload = function () {
      var d = window.KANBAN;
      if (d && typeof d === 'object') return take(d);
      window.KANBAN = prev;
      if (!D) showNotice(true);
    };
    s.onerror = function () {
      window.KANBAN = prev;
      if (first) showNotice(false); else location.reload();
    };
    document.head.appendChild(s);
  }
  function take(d) {
    var sig = JSON.stringify(d), dd = new Date().toDateString();
    if (sig === SIG && dd === DAY) return;
    SIG = sig; DAY = dd; D = d;
    try { render(); document.getElementById('notice').hidden = true; document.getElementById('app').hidden = false; }
    catch (e) { showNotice(true); }
  }
  function showNotice(broken) {
    document.getElementById('notice').innerHTML = broken
      ? '<b>看板的数据有地方写错了，读不出来。</b>跟 AI 说“看板打不开了，修一下”。'
      : '<b>还没有看板的数据。</b>跟 AI 说“更新看板”。它写好以后，这页半分钟内会自己变。';
    document.getElementById('notice').hidden = false;
    document.getElementById('app').hidden = true;
  }

  var NUM = '一二三四五六七八九';

  function todoRow(x) {
    return '<li class="todo ' + x.due.k + '"><span class="box"></span><div><p class="t">' + esc(x.事) + '</p>' +
      (cleanPath(x.页) ? '<p class="meta">' + pageLink(x.页) + '</p>' : '') + '</div>' +
      (x.due.k === 'late' ? '<span class="pill">' + x.due.t + '</span>' : '<span></span>') + '</li>';
  }
  function todoSection(list) {
    if (!list.length) return { body: '<p class="empty">没有写了日期的事。</p>' };
    var t = today(), tm = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1), h = '';
    var pick = function (k) { return list.filter(function (x) { return x.due.k === k; }); };
    var late = pick('late'), td = pick('today'), tmr = pick('tmr');
    var rest = list.filter(function (x) { return x.due.k === 'week' || x.due.k === 'later' || x.due.k === 'none'; });
    if (late.length) h += '<p class="group late">已经过期</p><ul>' + late.map(todoRow).join('') + '</ul>';
    h += '<p class="group">今天 · ' + md(t) + ' ' + wk(t) + (td.length ? '' : '<em>没有</em>') + '</p>';
    if (td.length) h += '<ul>' + td.map(todoRow).join('') + '</ul>';
    h += '<p class="group">明天 · ' + md(tm) + ' ' + wk(tm) + (tmr.length ? '' : '<em>没有</em>') + '</p>';
    if (tmr.length) h += '<ul>' + tmr.map(todoRow).join('') + '</ul>';
    if (rest.length) {
      h += '<p class="group">再往后</p><ul class="later">' + rest.map(function (x) {
        return '<li><span class="d">' + esc(x.due.d ? md(x.due.d) + ' ' + wk(x.due.d) : x.due.t) + '</span><span>' + esc(x.事) +
          (cleanPath(x.页) ? '<span class="sep"> · </span>' + pageLink(x.页) : '') + '</span></li>';
      }).join('') + '</ul>';
    }
    var n = late.length + td.length + tmr.length;
    return { body: h, count: n ? n + ' 件' : '' };
  }
  function askSection() {
    var list = items(D.要拍板, '事');
    if (!list.length) return { body: '<p class="empty">没有要找人拍板的。</p>' };
    return { count: list.length + ' 件', body: '<ul>' + list.map(function (x) {
      var meta = [txt(x.问谁) ? '<span class="who-tag">问 ' + esc(x.问谁) + '</span>' : '', pageLink(x.页)].filter(Boolean).join('<span class="sep">·</span>');
      return '<li class="ask"><p class="t">' + esc(x.事) + '</p>' + (meta ? '<p class="meta">' + meta + '</p>' : '') + '</li>';
    }).join('') + '</ul>' };
  }
  function missSection() {
    var list = items(D.还缺, '事');
    if (!list.length) return { body: '<p class="empty">没有还缺的。</p>' };
    return { count: list.length + ' 处', body: '<ul class="miss">' + list.map(function (x) {
      var meta = [txt(x.问谁) ? '问 ' + esc(x.问谁) : '', pageLink(x.页)].filter(Boolean).join('<span class="sep">·</span>');
      return '<li><p class="t">' + esc(x.事) + '</p><p class="meta">' + meta + '</p></li>';
    }).join('') + '</ul>' };
  }
  function recentSection() {
    var list = items(D.最近, '页');
    if (!list.length) return null;
    return { body: '<ul class="recent">' + list.map(function (x) {
      var d = day(x.更新);
      return '<li><div><span class="name">' + pageLink(x.页) + '</span>' + (txt(x.块) ? '<span class="blk">' + esc(x.块) + '</span>' : '') +
        (txt(x.一句话) ? '<p class="meta">' + esc(x.一句话) + '</p>' : '') + '</div><span class="d">' + esc(d ? md(d) : x.更新) + '</span></li>';
    }).join('') + '</ul>' };
  }
  function libSection() {
    var blocks = items(D.分块, '名'), raw = items(D.资料, '名'), h = '';
    if (blocks.length) {
      var total = blocks.reduce(function (s, b) { return s + (+b.几页 || 0); }, 0);
      h += '<p class="blocks">' + blocks.map(function (b) { return '<span>' + esc(b.名) + '<b>' + esc(+b.几页 || 0) + '</b> 页</span>'; }).join('') + '</p>';
      if (total) h = '<p>整理好的页一共 ' + total + ' 页：</p>' + h;
    }
    if (raw.length) {
      var todo = raw.filter(function (x) { return !yes(x.整理了吗); });
      h += '<p>收进来的资料 ' + raw.length + ' 份，' + (todo.length ? '还有 ' + todo.length + ' 份没整理：' : '都整理好了。') + '</p>';
      if (todo.length) h += '<p class="todo-raw">' + todo.map(function (x) { return pageLink(x.页, x.名); }).join('') + '</p>';
    }
    return h ? { body: '<div class="lib">' + h + '</div>' } : null;
  }
  function leadText(list) {
    var c = function (k) { return list.filter(function (x) { return x.due.k === k; }).length; };
    var late = c('late'), td = c('today'), tm = c('tmr'), ask = items(D.要拍板, '事').length, miss = items(D.还缺, '事').length;
    var a = [], b = [];
    if (td) a.push('今天要做 <b>' + td + '</b> 件');
    if (late) a.push((td ? '还有 ' : '有 ') + '<b>' + late + '</b> 件已经过期');
    if (tm) a.push('明天 <b>' + tm + '</b> 件');
    if (ask) b.push('<b>' + ask + '</b> 件要找人拍板');
    if (miss) b.push('<b>' + miss + '</b> 处还缺资料');
    return (a.length ? a.join('，') + '。' : '今天和明天没有要做的。') + (b.length ? b.join('，') + '。' : '没有要找人拍板的，也没有还缺的。');
  }

  var DONE_TONE = { '知识库': '#3B7DD8', '技能': '#E8912D', '智能体': '#4E9A3A', '编队': '#8E5EA2' };
  var doneLast = '', doneFirst = true, doneFresh = false, scoreSeen = {};


  var STAGE = {
    '技能': { 共: 5, 起: 1, 步: [
      ['挑好的事', '上午的知识库接上了，挑好了一件你最拿手、库里资料最厚的事', '起步'],
      ['技能第 1 版', '判断、红线都写下来了，每条写着来自知识库哪一页或你的哪句话', '有雏形'],
      ['盲比赢了', '同一份材料，两个没记忆的助手一个用技能、一个不用，打乱了让你挑，你挑中了用技能那份', '能用'],
      ['技能新一版', '会改了：改一句，重做再盲挑，你挑中了改后那份', '好用'],
      ['技能做完', '谁用、谁改都写清，装进软件，以后交代这件事 AI 自己照它做', '很强']] },
    '智能体': { 共: 5, 起: 1, 步: [
      ['岗位和第一件事', '岗位定下来了，第一件要交给它的事也挑好了，是你熟的事', '起步'],
      ['岗位说明书第 1 版', '它有了身份和规矩：做什么、不能碰什么、什么时候停下来问人', '有雏形'],
      ['第一单', '它自己查库、出图、自查，该停的停下交请示单；和不照说明书的那份盲挑，你挑中了它', '能用'],
      ['排班表', '它会自己上班了：每天到点去收件箱拿新事，它自己做的那一单你放心交出去', '好用'],
      ['岗位说明书新一版', '改一句重做再盲挑，你挑中了改后那份；放多少手、谁来审都定了', '很强']] },
    '编队': { 共: 4, 起: 6, 步: [
      ['分工表', '一个人变成一支队：做的、出图的、挑错的各管一段', '有雏形'],
      ['第一轮日报', '这支队自己接力做完几件事，人只批请示单', '能用'],
      ['改过的那一句', '找到是哪个队员哪一句，改完重做，你盲挑中了改后那份', '好用'],
      ['全队排班表', '这支队每天自己跑，只把要拍板的事交上来', '很强']] }
  };
  function stageFix(arr) {
    return (Array.isArray(arr) ? arr : []).map(function (x) {
      var b = STAGE[txt(x && x.块)], m = String(txt(x && x.步)).match(/\d+/);
      if (!b || !m) return x;
      var i = +m[0] - b.起, s = b.步[i];
      if (!s) return x;
      var y = {};
      for (var k in x) y[k] = x[k];
      y.名 = s[0]; y.意味着 = s[1]; y.档 = s[2]; y._n = i + 1; y._all = b.共; y.分 = Math.round((i + 1) / b.共 * 100);
      return y;
    });
  }
  function scoreTxt(x, sc) {
    return x._n ? '<b>' + x._n + '</b>/' + x._all + ' 步' : '<b>' + sc + '</b> 分';
  }
  function scoreOf(x) {
    var s = txt(x.分);
    if (!s || !isFinite(Number(s))) return null;
    return Math.max(0, Math.min(100, Math.round(Number(s))));
  }
  function doneBlock() {
    var list = items(stageFix(D.成果), '名');
    if (!list.length) { doneLast = ''; return ''; }
    var end = list[list.length - 1], sig = [end.名, end.步, end.更新, end.分].map(txt).join('|');
    doneFresh = sig !== doneLast;
    doneLast = sig;
    var prev = {}, top = {};
    var cards = list.map(function (x, i) {
      var isNew = i === list.length - 1, blk = txt(x.块), sc = scoreOf(x), tier = txt(x.档), gain = 0;
      if (sc != null) {
        gain = sc - (prev[blk] == null ? 0 : prev[blk]);
        prev[blk] = sc;
        top[blk] = { sc: sc, tier: tier, n: x._n, all: x._all };
      }
      var kick = [blk, txt(x.步)].filter(Boolean).join(' · ');
      var score = '';
      if (sc != null) {
        score = isNew
          ? '<span class="ds">' + scoreTxt(x, sc) + (tier ? ' <span class="sep">·</span> <em class="tr">' + esc(tier) + '</em>' : '') + '</span><span class="dbar"><i style="width:' + sc + '%"></i></span>'
          : '<span class="ds">' + scoreTxt(x, sc) + '</span>';
      }
      var inner = '<span class="dk"><i class="bd"></i><span>' + esc(kick) + '</span>' + (isNew ? '<em class="tag">刚做成</em>' : '') + (isNew && sc != null && gain > 0 ? '<em class="plus">' + (x._n ? '升到' + esc(tier) : '+' + gain + ' 分') + '</em>' : '') + '</span>' +
        '<b class="dt">' + esc(x.名) + '</b>' + score + (txt(x.意味着) ? '<span class="dm">' + esc(x.意味着) + '</span>' : '');
      var tip = cleanPath(x.页) ? '在 Obsidian 里打开' + (txt(x.更新) ? '（' + esc(x.更新) + '）' : '') : '';
      var box = cleanPath(x.页)
        ? '<a class="dn" href="' + esc(pageHref(x.页)) + '" title="' + tip + '">' + inner + '</a>'
        : '<div class="dn"' + (txt(x.更新) ? ' title="' + esc(x.更新) + '"' : '') + '>' + inner + '</div>';
      return '<li class="st' + (isNew ? ' last' + (doneFresh ? ' fresh' : '') : '') + '" style="--bc:' + (DONE_TONE[blk] || '#8A94A7') + '">' +
        '<span class="node"><i></i></span>' + box + '</li>';
    }).join('');
    var chips = ['技能', '智能体', '编队'].filter(function (b) { return top[b]; }).map(function (b) {
      var t = top[b];
      return '<span class="sc" data-b="' + b + '" data-to="' + (t.n || t.sc) + '" data-tier="' + esc(t.tier) + '" style="--bc:' + DONE_TONE[b] + '">' +
        '<span class="sb">' + b + '</span>' + (t.n ? '<b class="sn">' + t.n + '</b><span class="su">/' + t.all + ' 步</span>' : '<b class="sn">' + t.sc + '</b><span class="su">分</span>') +
        (t.tier ? '<span class="sd">·</span><em class="tr">' + esc(t.tier) + '</em>' : '') + '</span>';
    }).join('');
    return '<h2>这两天做成的' + (chips ? '<span class="scs">' + chips + '</span>' : '') + '<small>共 ' + list.length + ' 样</small></h2><ol class="tl">' + cards + '</ol>';
  }
  function scoreTick(still) {
    Array.prototype.forEach.call(document.querySelectorAll('#done .sc'), function (el) {
      var b = el.getAttribute('data-b'), to = Number(el.getAttribute('data-to')), tier = el.getAttribute('data-tier');
      var seen = scoreSeen[b], num = el.querySelector('.sn'), tr = el.querySelector('.tr');
      scoreSeen[b] = { n: to, tier: tier };
      if (!seen || still) return;
      if (tr && seen.tier !== tier) tr.className += ' bump';
      if (seen.n === to) return;
      var from = seen.n, t0 = null;
      num.textContent = from;
      var step = function (t) {
        if (t0 == null) t0 = t;
        var k = Math.min(1, (t - t0) / 800);
        num.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }
  function doneShow() {
    put('done', doneBlock());
    if (!document.querySelector('#done .tl')) return;
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var smooth = doneFresh && !doneFirst && !still;
    doneFirst = false;
    scoreTick(still);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var tl = document.querySelector('#done .tl');
        if (!tl) return;
        var left = tl.scrollWidth - tl.clientWidth;
        if (smooth && tl.scrollTo) tl.scrollTo({ left: left, behavior: 'smooth' }); else tl.scrollLeft = left;
      });
    });
  }

  function render() {
    var name = txt(D.库名) || '我的知识库', list = todos();
    document.title = name + ' · 看板';
    doneShow();
    put('who', esc([txt(D.谁), txt(D.岗位)].filter(Boolean).join(' · ')));
    put('title', esc(name));
    put('biz', esc(D.业务));
    put('stamp', esc(stamp()));
    put('home', pageLink('首页.md', '在 Obsidian 里打开首页'));
    put('facts', numbers().map(function (x) { return '<div><dt>' + esc(x.名) + '</dt><dd>' + esc(x.数) + '</dd></div>'; }).join(''));
    put('lead', leadText(list));
    var secs = [
      ['今天和明天要做的', todoSection(list)],
      ['要找人拍板的', askSection()],
      ['还缺的', missSection()],
      ['最近改过的页', recentSection()],
      ['库里有什么', libSection()]
    ].filter(function (s) { return s[1]; });
    document.getElementById('sections').innerHTML = secs.map(function (s, i) {
      return '<section><h2><span class="no">' + NUM.charAt(i) + '</span>' + s[0] + (s[1].count ? '<small>' + s[1].count + '</small>' : '') + '</h2>' + s[1].body + '</section>';
    }).join('');
  }

  load(true);
  setInterval(function () { load(false); }, 30000);
})();
</script>
</body>
</html>
