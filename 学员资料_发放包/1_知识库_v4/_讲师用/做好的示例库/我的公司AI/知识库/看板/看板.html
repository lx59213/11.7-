<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>看板</title>
<style>
:root {
  --bg: #EDF0F5; --card: #FFFFFF; --line: #E2E6EE; --track: #EEF1F6; --ink: #0F1728; --muted: #586378; --faint: #8A94A7;
  --accent: #3E55F2; --shadow: 0 1px 2px rgba(15,23,40,.05), 0 6px 18px rgba(15,23,40,.05);
  --late: 229,72,77; --today: 240,104,20; --tmr: 214,152,0; --week: 62,99,221; --later: 128,138,158; --ok: 38,153,96;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0A0F1B; --card: #121A2A; --line: #1F2A40; --track: #1A2336; --ink: #E8EDF6; --muted: #98A4BA; --faint: #66738C;
    --accent: #7D8CFF; --shadow: 0 0 0 1px #1A2438;
    --late: 255,107,112; --today: 255,140,66; --tmr: 245,190,60; --week: 120,150,255; --later: 140,150,172; --ok: 64,196,128;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
@media (min-width: 1700px) { html { font-size: 18px; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.6 var(--sans); }
a { color: inherit; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 22px 28px 28px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
.top > div { margin: 0 0 4px; }
h1 { margin: 0; font-size: 1.6rem; line-height: 1.3; font-weight: 700; letter-spacing: .01em; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
.right { text-align: right; font-size: .85rem; color: var(--muted); }
.live { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: rgb(var(--ok)); box-shadow: 0 0 0 3px rgba(var(--ok),.18); vertical-align: 1px; }
.home { display: inline-block; margin-top: 6px; padding: 3px 12px; border: 1px solid var(--line); border-radius: 99px; background: var(--card); text-decoration: none; color: var(--ink); font-size: .82rem; }
.home:hover { border-color: var(--accent); color: var(--accent); }
.card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); grid-gap: 14px; margin-bottom: 14px; }
.kpi { position: relative; overflow: hidden; padding: 16px 18px 14px; }
.kpi::after { content: ""; position: absolute; right: -30px; bottom: -40px; width: 120px; height: 120px; border-radius: 50%; background: rgba(var(--tone),.10); }
.kpi .lab { position: relative; z-index: 1; font-size: .9rem; color: var(--muted); }
.kpi .lab i { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 2px; background: rgb(var(--tone)); vertical-align: 1px; }
.kpi .num { position: relative; z-index: 1; margin-top: 4px; font-size: 3rem; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); grid-gap: 14px; margin-bottom: 14px; }
.lists { display: grid; grid-template-columns: repeat(3, 1fr); grid-gap: 14px; align-items: start; }
.stack > .card + .card { margin-top: 14px; }
h2 { display: flex; align-items: baseline; margin: 0 0 12px; font-size: 1rem; font-weight: 650; }
h2 small { margin-left: auto; font-weight: 400; font-size: .82rem; color: var(--faint); }
.bars .row { display: grid; grid-template-columns: 5.5em 1fr 2.2em; grid-column-gap: 10px; align-items: center; margin: 9px 0; font-size: .9rem; }
.bars .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); }
.bars .track { height: 14px; border-radius: 7px; background: var(--track); overflow: hidden; }
.bars .fill { height: 100%; border-radius: 7px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
.bars .n { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.donut { display: flex; align-items: center; }
.donut svg { flex: none; width: 150px; height: 150px; margin-right: 20px; }
.donut .ring { fill: none; stroke: var(--track); }
.donut .arc { fill: none; stroke: rgb(var(--ok)); stroke-linecap: round; transition: stroke-dasharray .9s cubic-bezier(.2,.8,.2,1); }
.donut .big { font-size: 30px; font-weight: 700; fill: var(--ink); }
.donut .small { font-size: 12px; fill: var(--muted); }
.legend { font-size: .9rem; color: var(--muted); }
.legend p { margin: 0 0 6px; }
.legend b { color: var(--ink); font-size: 1.1rem; margin: 0 2px; }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 50%; vertical-align: 1px; }
.legend .todo-raw { margin-top: 8px; font-size: .85rem; }
.legend .todo-raw a { display: block; }
.cols { display: flex; align-items: flex-end; height: 150px; padding-top: 6px; }
.cols .c { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.cols .c + .c { margin-left: 10px; }
.cols .v { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.cols .bar { width: 100%; max-width: 46px; min-height: 4px; border-radius: 8px 8px 3px 3px; transition: height .9s cubic-bezier(.2,.8,.2,1); }
.cols .l { margin-top: 6px; font-size: .8rem; color: var(--muted); white-space: nowrap; }
.item { padding: 10px 0; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; padding-top: 2px; }
.item .t { margin: 0; font-size: .95rem; line-height: 1.55; }
.item .m { margin: 4px 0 0; font-size: .8rem; color: var(--muted); }
.pill { display: inline-block; margin-right: 8px; padding: 0 8px; border-radius: 99px; font-size: .75rem; line-height: 1.75; font-weight: 600; white-space: nowrap; color: rgb(var(--tone)); background: rgba(var(--tone),.13); vertical-align: 1px; }
.pg { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
.pg::after { content: " ↗"; color: var(--faint); }
.pg:hover { color: var(--accent); border-color: var(--accent); }
.ask { border-top: 3px solid rgb(var(--tmr)); }
.who { color: rgb(var(--tmr)); font-weight: 600; margin-right: 8px; }
.dot { display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; vertical-align: 1px; }
.recent .name .pg { color: var(--ink); font-weight: 600; font-size: .92rem; border: 0; }
.recent .d { float: right; font-size: .78rem; color: var(--faint); }
.empty { margin: 4px 0; color: var(--faint); font-size: .92rem; }
.notice { padding: 28px; font-size: 1.05rem; line-height: 1.9; }
.notice b { display: block; font-size: 1.2rem; }
.foot { margin-top: 22px; text-align: center; font-size: .82rem; color: var(--faint); }
@media (max-width: 1100px) { .lists { grid-template-columns: 1fr 1fr; } }
@media (max-width: 720px) { .lists { grid-template-columns: 1fr; } .wrap { padding: 16px; } .right { text-align: left; } }
@media (prefers-reduced-motion: reduce) { .bars .fill, .donut .arc, .cols .bar { transition: none; } }
/* 这两天做成的 */
.done { --glow: 62,85,242; }
.done .tl { display: flex; margin: 0; padding: 4px 6px 12px; list-style: none; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.done .st { position: relative; flex: none; display: flex; flex-direction: column; width: 210px; margin-right: 14px; }
.done .st.last { width: 320px; max-width: 80vw; margin-right: 0; }
.done .node { position: relative; display: block; height: 22px; }
.done .node::before { content: ""; position: absolute; left: 6px; right: -14px; top: 10px; height: 2px; background: var(--line); }
.done .st.last .node::before { display: none; }
.done .node i { position: absolute; left: 0; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--bc); box-shadow: 0 0 0 3px var(--card); }
.done .st.last .node i { top: 3px; width: 16px; height: 16px; box-shadow: 0 0 0 3px var(--card), 0 0 0 5px rgba(var(--glow), .25); }
.done .dn { display: flex; flex-direction: column; flex: 1; padding: 10px 12px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--track); color: inherit; text-decoration: none;  }
.done a.dn { transition: border-color .15s, transform .15s; }
.done a.dn:hover { border-color: var(--bc); transform: translateY(-1px); }
.done .dk { display: flex; align-items: center; font-size: .76rem; line-height: 1.7; color: var(--muted); }
.done .dk .bd { flex: none; width: 8px; height: 8px; margin-right: 7px; border-radius: 2px; background: var(--bc); }
.done .dt { margin-top: 4px; font-size: .96rem; line-height: 1.45; font-weight: 650; color: var(--ink);  }
.done .dm { margin-top: 4px; font-size: .84rem; line-height: 1.55; color: var(--muted); }
.done .st.last .dn { padding: 14px 16px 16px; border: 2px solid var(--accent); background: var(--card); box-shadow: 0 8px 24px rgba(var(--glow), .16); }
.done .st.last a.dn:hover { border-color: var(--accent); }
.done .st.last .dk { font-size: .8rem; }
.done .st.last .dt { margin-top: 6px; font-size: 1.22rem; line-height: 1.4; }
.done .st.last .dm { margin-top: 6px; font-size: .92rem; color: var(--ink); }
.done .tag { margin-left: auto; padding: 0 9px; border-radius: 99px; font-style: normal; font-size: .74rem; font-weight: 650; line-height: 1.75; white-space: nowrap; color: var(--card); background: var(--accent); }
@keyframes doneIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes doneGlow { from { box-shadow: 0 0 0 0 rgba(var(--glow), .4); } to { box-shadow: 0 0 0 14px rgba(var(--glow), 0); } }
.done .st.fresh .dn { animation: doneIn .55s cubic-bezier(.2,.8,.2,1) both, doneGlow 1.3s ease-out .35s 1 both; }
@media (prefers-reduced-motion: reduce) { .done .st.fresh .dn { animation: none; } .done a.dn { transition: none; } }
@media (max-width: 560px) { .done .st { width: 200px; } .done .st.last { width: 290px; } }
.done { margin-bottom: 14px; }
/* 分数 */
.done .st.last { width: 340px; }
.done .st.last .dk { flex-wrap: wrap; }
.done .plus { margin-left: 6px; padding: 0 9px; border-radius: 99px; font-style: normal; font-size: .86rem; font-weight: 750; line-height: 1.7; white-space: nowrap; font-variant-numeric: tabular-nums; color: #fff; background: var(--bc); background: color-mix(in srgb, var(--bc) 80%, #000); }
.done .ds { margin-top: 6px; font-size: .8rem; font-weight: 650; line-height: 1.4; color: var(--muted); font-variant-numeric: tabular-nums; }
.done .ds b { font-size: .95rem; font-weight: 750; color: var(--ink); }
.done .st.last .ds { margin-top: 8px; font-size: .92rem; }
.done .st.last .ds b { font-size: 1.75rem; line-height: 1; }
.done .ds .sep { color: var(--faint); }
.done .tr { font-style: normal; font-weight: 700; color: var(--bc); color: color-mix(in srgb, var(--bc) 82%, var(--ink)); }
.done .dbar { display: block; height: 5px; margin-top: 8px; border-radius: 99px; background: rgba(128,128,128,.2); overflow: hidden; }
.done .dbar i { display: block; height: 100%; border-radius: inherit; background: var(--bc); transform-origin: left; }
.done .scs { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px 8px; margin: -4px 0 -4px auto; }
.done .scs + small { margin-left: 14px; }
.done .sc { display: inline-flex; align-items: baseline; padding: 3px 12px 4px 11px; border: 1px solid var(--bc); border-radius: 99px; font-size: .8rem; font-weight: 400; line-height: 1.3; white-space: nowrap; color: var(--muted); background: color-mix(in srgb, var(--bc) 9%, transparent); }
.done .sc .sb { margin-right: 6px; }
.done .sc .sn { font-size: 1.55rem; font-weight: 750; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.done .sc .su { margin-left: 2px; }
.done .sc .sd { margin: 0 5px; color: var(--faint); }
.done .sc .tr { font-size: .9rem; }
@keyframes plusPop { from { opacity: 0; transform: scale(.55); } 60% { opacity: 1; transform: scale(1.18); } to { opacity: 1; transform: none; } }
@keyframes barGrow { from { transform: scaleX(0); } to { transform: none; } }
@keyframes tierPop { 0% { transform: scale(1); background: transparent; } 30% { transform: scale(1.22); background: color-mix(in srgb, var(--bc) 30%, transparent); } 100% { transform: scale(1); background: transparent; } }
.done .st.fresh .plus { animation: plusPop .7s cubic-bezier(.2,.9,.3,1.2) .35s both; }
.done .st.fresh .dbar i { animation: barGrow .9s cubic-bezier(.2,.8,.2,1) .2s both; }
.done .tr.bump { display: inline-block; margin: 0 -4px; padding: 0 4px; border-radius: 6px; animation: tierPop .9s ease-out; }
@media (prefers-reduced-motion: reduce) { .done .st.fresh .plus, .done .st.fresh .dbar i, .done .tr.bump { animation: none; } }
@media (max-width: 560px) {
  .done .st.last { width: 300px; }
  .done h2 { flex-wrap: wrap; }
  .done .scs { order: 3; flex-basis: 100%; justify-content: flex-start; margin: 8px 0 2px; }
  .done .scs + small { order: 2; margin-left: auto; }
}
/* 进度卡：一个技能、一个智能体一张 */
#done .jd-lane { margin-top: 1.1em; }
#done .jd-lh { display: flex; align-items: center; gap: 8px; margin: 0 0 2px; }
#done .jd-lh .jd-kind { font-size: .86rem; padding: 1px 10px 1px 8px; }
#done .jd-lh .jd-kind svg { width: 15px; height: 15px; }
#done .jd-lh small { font-size: .82rem; color: var(--faint); }
#done .jd { display: flex; align-items: stretch; gap: 16px; margin: 0 -6px;  padding: 6px 6px 14px; list-style: none; overflow-x: auto; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
#done .jd-card { --ok: #3F8A4F; --part: #B07A12; --no: #B5483A; --c: var(--faint); flex: 0 0 360px; max-width: 82vw; scroll-snap-align: start; display: flex; flex-direction: column; padding: 14px 16px 12px; border-radius: 10px; border: 1px solid rgba(34,32,28,.16); border-top: 3px solid var(--c); background: var(--sheet); box-shadow: 0 1px 2px rgba(60,50,30,.06), 0 6px 18px rgba(60,50,30,.08); }
#done .jd-hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#done .jd-card.g0 { --c: #2F7D45; } #done .jd-card.g1 { --c: #2E78A8; } #done .jd-card.g2 { --c: #B07A12; } #done .jd-card.g3 { --c: #B5483A; }
#done .jd-kind { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px 0 6px; border-radius: 99px; background: var(--soft); color: var(--ink); font-size: .74rem; font-weight: 600; line-height: 1.7; }
#done .jd-kind svg { width: 13px; height: 13px; }
#done .jd-nm { display: block; margin-top: 0; font: 600 1.08rem/1.35 var(--serif); }
#done .jd-nm a { color: inherit; text-decoration: none; }
#done .jd-nm a:hover { text-decoration: underline; }
#done .jd-gd { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font: 700 1.25rem/1 var(--serif); cursor: help; }
#done .jd-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 12px; }
#done .jd-t { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 46px; padding: 4px 2px; border-radius: 5px; background: var(--soft); color: var(--faint); font-size: .72rem; line-height: 1.25; text-align: center; }
#done .jd-t b { font-size: .82rem; line-height: 1.2; }
#done .jd-t.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ink); } #done .jd-t.ok b { color: var(--ok); }
#done .jd-t.part { background: color-mix(in srgb, var(--part) 14%, transparent); color: var(--ink); } #done .jd-t.part b { color: var(--part); }
#done .jd-t.no { background: color-mix(in srgb, var(--no) 13%, transparent); color: var(--ink); } #done .jd-t.no b { color: var(--no); }
#done .jd-t.nx { background: transparent; border: 1.5px dashed var(--muted); color: var(--ink); }
#done .jd-t.nx b { font-size: .68rem; font-weight: 600; }
#done .jd-t.skip b { font-size: .66rem; font-weight: 400; }
#done .jd-why { margin: 10px 0 0; font-size: .86rem; line-height: 1.55; color: var(--muted); }
#done .jd-new { animation: jdPop 1.2s cubic-bezier(.2,.8,.2,1) both; }
@keyframes jdPop { 0% { transform: scale(.6); opacity: 0; } 50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 30%, transparent); } 100% { transform: none; box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { #done .jd-new { animation: none; } }
@media (prefers-color-scheme: dark) { #done .jd-card { --ok: #7BC487; --part: #E2B25A; --no: #EC8C77; border-color: rgba(255,255,255,.14); box-shadow: none; } #done .jd-card.g0 { --c: #4E9F62; } #done .jd-card.g1 { --c: #4C93C2; } #done .jd-card.g2 { --c: #C08A22; } #done .jd-card.g3 { --c: #C85A4A; } }
@media (max-width: 560px) { #done .jd-card { flex-basis: 300px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">看板</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="right">
      <div><span class="live"></span><span id="stamp"></span></div>
      <span id="home"></span>
    </div>
  </header>
  <div class="card notice" id="notice" hidden></div>
  <main id="app" hidden>
    <section class="card done" id="done" hidden></section>
    <section class="kpis" id="kpis"></section>
    <section class="charts" id="charts"></section>
    <section class="lists" id="lists"></section>
  </main>
  <footer class="foot">数据是 AI 整理时写的。想看最新的，跟 AI 说‘更新看板’。</footer>
</div>
<script>
(function () {
  'use strict';
  var DEMO = /[?&#]demo\b/.test(location.search + location.hash);
  var FILE = DEMO ? '看板数据_示例.js' : '看板数据.js';
  var WEEK = '日一二三四五六';
  var D = null, SIG = '', DAY = '';

  function arr(v) { return Array.isArray(v) ? v : []; }
  function txt(v) { return v == null || typeof v === 'object' ? '' : String(v).trim(); }
  function esc(v) { return txt(v).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function cleanPath(p) { return txt(p).replace(/\\/g, '/').replace(/^\.?\/+/, ''); }
  function pageName(p) { var s = cleanPath(p).replace(/\.md$/i, ''); return s.slice(s.lastIndexOf('/') + 1); }
  function pageHref(p) {
    return 'obsidian://open?vault=' + encodeURIComponent(txt(D && D.库文件夹) || '知识库') +
      '&file=' + encodeURIComponent(cleanPath(p).replace(/\.md$/i, ''));
  }
  function pageLink(p, label, cls) {
    var name = txt(label) || pageName(p);
    if (!cleanPath(p)) return name ? '<span class="' + (cls || 'pg') + '">' + esc(name) + '</span>' : '';
    return '<a class="' + (cls || 'pg') + '" href="' + esc(pageHref(p)) + '" title="在 Obsidian 里打开">' + esc(name) + '</a>';
  }
  function yes(v) { return v === true || /^(是|对|有|整理了|已整理|好了|✓|true|yes)$/i.test(txt(v)); }
  function day(v) { var m = /(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(txt(v)); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }
  function today() {
    var u = DEMO && D && day(D.更新);
    if (u) return u;
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function diff(d) { return Math.round((d - today()) / 864e5); }
  function md(d) { return (d.getFullYear() !== today().getFullYear() ? d.getFullYear() + '年' : '') + (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  function wk(d) { return '周' + WEEK.charAt(d.getDay()); }
  function due(v) {
    var d = day(v);
    if (!d) return { k: 'none', n: 1e4, t: txt(v) || '没写哪天' };
    var n = diff(d);
    var k = n < 0 ? 'late' : n === 0 ? 'today' : n === 1 ? 'tmr' : n <= 7 ? 'week' : 'later';
    var t = k === 'late' ? '过了 ' + -n + ' 天' : k === 'today' ? '今天' : k === 'tmr' ? '明天' : k === 'week' ? wk(d) + ' · ' + n + ' 天后' : md(d);
    return { k: k, n: n, d: d, t: t };
  }
  function todos() {
    return arr(D.待办).map(function (x, i) { x = x || {}; return { 事: txt(x.事), 页: x.页, due: due(x.哪天), i: i }; })
      .filter(function (x) { return x.事; })
      .sort(function (a, b) { return a.due.n - b.due.n || a.i - b.i; });
  }
  function items(list, key) { return arr(list).filter(function (x) { return x && txt(x[key]); }); }
  function stamp() {
    var u = txt(D.更新), d = day(u);
    if (!d) return u ? '更新于 ' + u : '';
    var t = /(\d{1,2})[:：](\d{2})/.exec(u), ago = -diff(d);
    return '更新于 ' + md(d) + ' ' + wk(d) + (t ? ' ' + t[1] + ':' + t[2] : '') + (ago > 0 ? '（' + ago + ' 天前）' : '');
  }
  function numbers() {
    var n = D.数字;
    if (n && !Array.isArray(n) && typeof n === 'object') n = Object.keys(n).map(function (k) { return { 名: k, 数: n[k] }; });
    return arr(n).filter(function (x) { return x && txt(x.名); });
  }
  function put(id, html) { var el = document.getElementById(id); el.innerHTML = html || ''; el.hidden = !html; }

  function load(first) {
    var prev = window.KANBAN, old = document.getElementById('kanban-data'), s = document.createElement('script');
    window.KANBAN = undefined;
    if (old) old.parentNode.removeChild(old);
    s.id = 'kanban-data';
    s.src = FILE + (first ? '' : '?v=' + Date.now());
    s.onload = function () {
      var d = window.KANBAN;
      if (d && typeof d === 'object') return take(d);
      window.KANBAN = prev;
      if (!D) showNotice(true);
    };
    s.onerror = function () {
      window.KANBAN = prev;
      if (first) showNotice(false); else location.reload();
    };
    document.head.appendChild(s);
  }
  function take(d) {
    var sig = JSON.stringify(d), dd = new Date().toDateString();
    if (sig === SIG && dd === DAY) return;
    SIG = sig; DAY = dd; D = d;
    try { render(); document.getElementById('notice').hidden = true; document.getElementById('app').hidden = false; }
    catch (e) { showNotice(true); }
  }
  function showNotice(broken) {
    document.getElementById('notice').innerHTML = broken
      ? '<b>看板的数据有地方写错了，读不出来。</b>跟 AI 说“看板打不开了，修一下”。'
      : '<b>还没有看板的数据。</b>跟 AI 说“更新看板”。它写好以后，这页半分钟内会自己变。';
    document.getElementById('notice').hidden = false;
    document.getElementById('app').hidden = true;
  }

  var PALETTE = ['#D9534F', '#3B7DD8', '#4E9A3A', '#E8912D', '#8E5EA2', '#1FA2A0', '#C2577F', '#7A8899'];
  var BUCKETS = [['late', '过期'], ['today', '今天'], ['tmr', '明天'], ['week', '7 天内'], ['later', '更远']];
  var first = true;

  function blockColor(name) {
    var i = items(D.分块, '名').map(function (b) { return txt(b.名); }).indexOf(txt(name));
    return i < 0 ? '#8A94A7' : PALETTE[i % PALETTE.length];
  }
  function tone(label) {
    var s = txt(label);
    return /拍板|确认/.test(s) ? 'tmr' : /缺|补/.test(s) ? 'late' : /做|跟进|今天|明天|到期/.test(s) ? 'today' : /资料|原件/.test(s) ? 'ok' : 'week';
  }
  function card(title, small, body, cls) {
    return '<div class="card ' + (cls || '') + '"><h2>' + title + (small ? '<small>' + small + '</small>' : '') + '</h2>' + body + '</div>';
  }

  function kpis() {
    return numbers().map(function (x) {
      return '<div class="card kpi" style="--tone:var(--' + tone(x.名) + ')"><div class="lab"><i></i>' + esc(x.名) +
        '</div><div class="num" data-n="' + esc(x.数) + '">' + esc(x.数) + '</div></div>';
    }).join('');
  }
  function blockChart() {
    var list = items(D.分块, '名');
    if (!list.length) return '';
    var max = 1, total = 0;
    list.forEach(function (b) { var n = +b.几页 || 0; max = Math.max(max, n); total += n; });
    return card('每块有几页', '一共 ' + total + ' 页', '<div class="bars">' + list.map(function (b) {
      var n = +b.几页 || 0;
      return '<div class="row"><span class="name" title="' + esc(b.名) + '">' + esc(b.名) + '</span><span class="track"><span class="fill" style="display:block;background:' +
        blockColor(b.名) + ';width:' + (first ? 0 : n / max * 100) + '%" data-w="' + (n / max * 100) + '"></span></span><span class="n">' + n + '</span></div>';
    }).join('') + '</div>');
  }
  function rawChart() {
    var list = items(D.资料, '名');
    if (!list.length) return '';
    var done = list.filter(function (x) { return yes(x.整理了吗); }).length, rest = list.filter(function (x) { return !yes(x.整理了吗); });
    var r = 60, c = 2 * Math.PI * r, part = done / list.length * c;
    var svg = '<svg viewBox="0 0 150 150" role="img" aria-label="资料整理了 ' + done + ' 份，一共 ' + list.length + ' 份">' +
      '<circle class="ring" cx="75" cy="75" r="' + r + '" stroke-width="16"/>' +
      '<circle class="arc" cx="75" cy="75" r="' + r + '" stroke-width="16" transform="rotate(-90 75 75)" stroke-dasharray="' +
      (first ? 0 : part) + ' ' + c + '" data-part="' + part + '" data-c="' + c + '"' + (done ? '' : ' style="stroke:none"') + '/>' +
      '<text class="big" x="75" y="80" text-anchor="middle">' + done + '<tspan class="small" dx="2">/ ' + list.length + '</tspan></text>' +
      '<text class="small" x="75" y="102" text-anchor="middle">' + (rest.length ? '整理了 ' + Math.round(done / list.length * 100) + '%' : '都整理了') + '</text></svg>';
    var legend = '<div class="legend"><p><i style="background:rgb(var(--ok))"></i>整理了<b>' + done + '</b>份</p>' +
      '<p><i style="background:var(--track)"></i>还没整理<b>' + rest.length + '</b>份</p>' +
      (rest.length ? '<div class="todo-raw">' + rest.slice(0, 4).map(function (x) { return pageLink(x.页, x.名); }).join('') +
        (rest.length > 4 ? '<span>还有 ' + (rest.length - 4) + ' 份</span>' : '') + '</div>' : '') + '</div>';
    return card('收进来的资料', '一共 ' + list.length + ' 份', '<div class="donut">' + svg + legend + '</div>');
  }
  function dueChart(list) {
    if (!list.length) return '';
    var count = {}, max = 1, total = 0;
    BUCKETS.forEach(function (b) { count[b[0]] = 0; });
    list.forEach(function (x) { if (x.due.k in count) { count[x.due.k]++; total++; } });
    if (!total) return '';
    BUCKETS.forEach(function (b) { max = Math.max(max, count[b[0]]); });
    return card('要做的事，按日子分', '一共 ' + total + ' 件', '<div class="cols">' + BUCKETS.map(function (b) {
      var h = count[b[0]] / max * 100;
      return '<div class="c"><span class="v" style="color:' + (count[b[0]] ? 'rgb(var(--' + b[0] + '))' : 'var(--faint)') + '">' + count[b[0]] +
        '</span><span class="bar" style="background:rgba(var(--' + b[0] + '),' + (count[b[0]] ? '.85' : '.18') + ');height:' + (first ? 0 : h) + '%" data-h="' + h + '"></span><span class="l">' + b[1] + '</span></div>';
    }).join('') + '</div>');
  }

  function todoCard(list) {
    var body = list.length ? list.map(function (x) {
      var k = x.due.k === 'none' ? 'later' : x.due.k;
      return '<div class="item"><p class="t"><span class="pill" style="--tone:var(--' + k + ')">' + esc(x.due.t) + '</span>' + esc(x.事) + '</p>' +
        (cleanPath(x.页) ? '<p class="m">' + pageLink(x.页) + '</p>' : '') + '</div>';
    }).join('') : '<p class="empty">没有写了日期的事。</p>';
    return card('要做的事', list.length ? list.length + ' 件' : '', body);
  }
  function askCard() {
    var list = items(D.要拍板, '事');
    var body = list.length ? list.map(function (x) {
      return '<div class="item"><p class="t">' + esc(x.事) + '</p><p class="m">' + (txt(x.问谁) ? '<span class="who">问 ' + esc(x.问谁) + '</span>' : '') + pageLink(x.页) + '</p></div>';
    }).join('') : '<p class="empty">没有要找人拍板的。</p>';
    return card('要找人拍板', list.length ? list.length + ' 件' : '', body, 'ask');
  }
  function missCard() {
    var list = items(D.还缺, '事');
    var body = list.length ? list.map(function (x) {
      return '<div class="item"><p class="t">' + esc(x.事) + '</p><p class="m">' + (txt(x.问谁) ? '问 ' + esc(x.问谁) + ' · ' : '') + pageLink(x.页) + '</p></div>';
    }).join('') : '<p class="empty">没有还缺的。</p>';
    return card('还缺的', list.length ? list.length + ' 处' : '', body);
  }
  function recentCard() {
    var list = items(D.最近, '页');
    var body = list.length ? list.map(function (x) {
      var d = day(x.更新);
      return '<div class="item recent"><p class="t name"><span class="d">' + esc(d ? md(d) : x.更新) + '</span><span class="dot" style="background:' + blockColor(x.块) + '"></span>' +
        pageLink(x.页) + '</p>' + (txt(x.一句话) ? '<p class="m">' + esc(x.一句话) + '</p>' : '') + '</div>';
    }).join('') : '<p class="empty">还没有。</p>';
    return card('最近改过的页', '', body);
  }

  function animate() {
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        [].forEach.call(document.querySelectorAll('.fill[data-w]'), function (el) { el.style.width = el.getAttribute('data-w') + '%'; });
        [].forEach.call(document.querySelectorAll('.bar[data-h]'), function (el) { el.style.height = el.getAttribute('data-h') + '%'; });
        [].forEach.call(document.querySelectorAll('.arc[data-part]'), function (el) { el.setAttribute('stroke-dasharray', el.getAttribute('data-part') + ' ' + el.getAttribute('data-c')); });
      });
    });
    if (still) return;
    [].forEach.call(document.querySelectorAll('.num[data-n]'), function (el) {
      var end = +el.getAttribute('data-n'), t0 = 0;
      if (!(end > 0) || Math.round(end) !== end) return;
      el.textContent = '0';
      requestAnimationFrame(function step(t) {
        t0 = t0 || t;
        var p = Math.min(1, (t - t0) / 900);
        el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      });
    });
  }

  var DONE_TONE = { '知识库': '#3B7DD8', '技能': '#E8912D', '智能体': '#4E9A3A', '编队': '#8E5EA2' };
  var doneLast = '', doneFirst = true, doneFresh = false, scoreSeen = {};


  // 每一步小格上的字，和提示词文件名对得上
  var STEPS = {
    '技能': ['挑一件事', '写手册', '再做一份', '改一句', '谁用谁改'],
    '智能体': ['定岗位', '说明书', '交出去', '上班表', '改一句', '拆成队', '交几件事', '改一处', '全队排班']
  };
  var KIND_ICON = {
    '技能': '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/>',
    '智能体': '<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4.5"/><circle cx="12" cy="4" r="1"/><circle cx="9" cy="13.5" r="1.2" fill="currentColor"/><circle cx="15" cy="13.5" r="1.2" fill="currentColor"/>',
    '知识库': '<path d="M12 4 3 8.5l9 4.5 9-4.5z"/><path d="m3 12.5 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/>'
  };
  var GRADE_TIP = '做到了算 1 分，差一点算半分，没做到不算分；做过的步平均下来，满分是优，七成以上良，五成以上中，不到五成差';
  function kindTag(kind) {
    var icon = KIND_ICON[kind] ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + KIND_ICON[kind] + '</svg>' : '';
    return '<span class="jd-kind">' + icon + esc(kind) + '</span>';
  }
  function stepNo(x) { var m = String(txt(x && x.步)).match(/\d+/); return m ? +m[0] : 0; }
  function pageName(p) { return cleanPath(p).split('/').pop().replace(/\.md$/i, ''); }
  // 一个技能、一个智能体一张卡；编队（智能体第 6–9 步）接在前面那个智能体的卡上；同一步写过几次，用最后那次
  function stageCards(list) {
    var cards = [], byKey = {}, lastAgent = '';
    (Array.isArray(list) ? list : []).forEach(function (x, i) {
      if (!x || typeof x !== 'object') return;
      var blk = txt(x.块), kind = blk === '编队' ? '智能体' : blk, n = stepNo(x);
      if (!STEPS[kind] || !n || n > STEPS[kind].length) {
        if (txt(x.名)) cards.push({ plain: x, kind: blk, at: i, first: i });
        return;
      }
      var key = blk === '编队' && lastAgent ? lastAgent : kind + '|' + cleanPath(x.页);
      var c = byKey[key];
      if (!c) { c = byKey[key] = { kind: kind, page: x.页, step: {}, at: i, first: i }; cards.push(c); }
      if (blk === '智能体') lastAgent = key;
      c.step[n] = x; c.at = i; c.last = n;
    });
    // 照上课的先后排：知识库、技能、智能体，同一类先做的在左；不穿插
    var ORDER = { '知识库': 0, '技能': 1, '智能体': 2 };
    return cards.sort(function (a, b) { return ((ORDER[a.kind] == null ? 3 : ORDER[a.kind]) - (ORDER[b.kind] == null ? 3 : ORDER[b.kind])) || a.first - b.first; });
  }
  function resultOf(x) { var r = txt(x.结果); return r === '没过' ? 'no' : r === '一般' ? 'part' : 'ok'; }
  function gradeOf(c) {
    var n = 0, s = 0;
    for (var k in c.step) { n++; s += { ok: 1, part: .5, no: 0 }[resultOf(c.step[k])]; }
    var p = n ? s / n : 0;
    return p >= .999 ? '优' : p >= .7 ? '良' : p >= .5 ? '中' : '差';
  }
  function whyOf(c) {
    var ks = Object.keys(c.step).map(Number).sort(function (a, b) { return a - b; });
    var weak = ks.filter(function (k) { return resultOf(c.step[k]) !== 'ok'; });
    if (!weak.length) return ks.length > 1 ? '做过的 ' + ks.length + ' 步都做到了' : '这一步做到了';
    // 先说没做到的，再说差一点的，最多两句
    var said = weak.filter(function (k) { return resultOf(c.step[k]) === 'no'; })
      .concat(weak.filter(function (k) { return resultOf(c.step[k]) === 'part'; }))
      .map(function (k) { return txt(c.step[k].实话); }).filter(Boolean).slice(0, 2);
    return '差在第 ' + weak.join('、') + ' 步' + (said.length ? '：' + said.join('；') : '');
  }
  function stageCard(c, isNew) {
    if (c.plain) {
      var x = c.plain, kind = txt(x.块) || '成果';
      return '<li class="jd-card"><div class="jd-hd"><div>' +
        '<b class="jd-nm">' + (cleanPath(x.页) ? '<a href="' + esc(pageHref(x.页)) + '">' + esc(x.名) + '</a>' : esc(x.名)) + '</b></div></div>' +
        (txt(x.意味着) ? '<p class="jd-why">' + esc(x.意味着) + '</p>' : '') + '</li>';
    }
    var names = STEPS[c.kind], max = Math.max.apply(null, Object.keys(c.step).map(Number)), tiles = '';
    for (var i = 1; i <= names.length; i++) {
      var x = c.step[i], cls = 'jd-t', mark = '';
      if (x) { var r = resultOf(x); cls += ' ' + r; mark = { ok: '✓', part: '!', no: '✕' }[r]; if (isNew && i === c.last) cls += ' jd-new'; }
      else if (i === max + 1) { cls += ' nx'; mark = '下一步'; }
      else if (i < max) { cls += ' skip'; mark = '没做'; }
      tiles += '<span class="' + cls + '" title="第 ' + i + ' 步"><b>' + mark + '</b>' + esc(names[i - 1]) + '</span>';
    }
    var name = esc(pageName(c.page));
    var title = cleanPath(c.page) ? '<a href="' + esc(pageHref(c.page)) + '" title="在 Obsidian 里打开">' + name + '</a>' : name;
    var g = gradeOf(c);
    // 卡上的颜色只表示好坏：优、良、中、差各一种；技能还是智能体看这一行的标签
    return '<li class="jd-card g' + '优良中差'.indexOf(g) + '">' +
      '<div class="jd-hd"><div>' + '<b class="jd-nm">' + title + '</b></div><span class="jd-gd" title="' + GRADE_TIP + '">' + g + '</span></div>' +
      '<div class="jd-tiles" style="--n:' + names.length + '">' + tiles + '</div>' +
      '<p class="jd-why">' + esc(whyOf(c)) + '</p></li>';
  }
  function doneBlock() {
    var raw = Array.isArray(D.成果) ? D.成果 : [], cards = stageCards(raw);
    if (!cards.length) { doneLast = ''; return ''; }
    var end = raw[raw.length - 1] || {}, sig = [end.块, end.步, end.更新, end.结果, raw.length].map(txt).join('|');
    doneFresh = sig !== doneLast && !doneFirst;
    doneFirst = false;
    doneLast = sig;
    // 知识库、技能、智能体各一行，不混在一起；每行最近做的在最左，多了往右滑
    var lanes = [], seen = {};
    cards.forEach(function (c) { var k = c.kind || '成果'; if (!seen[k]) { seen[k] = []; lanes.push(k); } seen[k].push(c); });
    var newest = cards.reduce(function (m, c) { return c.at > m.at ? c : m; }, cards[0]);
    return '<h2>这两天做成的<small>共 ' + cards.length + ' 样</small></h2>' + lanes.map(function (k) {
      var list = seen[k].slice().sort(function (a, b) { return b.at - a.at; });
      return '<div class="jd-lane"><p class="jd-lh">' + kindTag(k) + '<small>' + list.length + ' 个</small></p><ol class="jd">' +
        list.map(function (c) { return stageCard(c, c === newest && doneFresh); }).join('') + '</ol></div>';
    }).join('');
  }
  function scoreTick(still) {
    Array.prototype.forEach.call(document.querySelectorAll('#done .sc'), function (el) {
      var b = el.getAttribute('data-b'), to = Number(el.getAttribute('data-to')), tier = el.getAttribute('data-tier');
      var seen = scoreSeen[b], num = el.querySelector('.sn'), tr = el.querySelector('.tr');
      scoreSeen[b] = { n: to, tier: tier };
      if (!seen || still) return;
      if (tr && seen.tier !== tier) tr.className += ' bump';
      if (seen.n === to) return;
      var from = seen.n, t0 = null;
      num.textContent = from;
      var step = function (t) {
        if (t0 == null) t0 = t;
        var k = Math.min(1, (t - t0) / 800);
        num.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }
  function doneShow() {
    put('done', doneBlock());
    if (!document.querySelector('#done .tl')) return;
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var smooth = doneFresh && !doneFirst && !still;
    doneFirst = false;
    scoreTick(still);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var tl = document.querySelector('#done .tl');
        if (!tl) return;
        var left = tl.scrollWidth - tl.clientWidth;
        if (smooth && tl.scrollTo) tl.scrollTo({ left: left, behavior: 'smooth' }); else tl.scrollLeft = left;
      });
    });
  }

  function render() {
    var name = txt(D.库名) || '我的知识库', list = todos();
    document.title = name + ' · 看板';
    doneShow();
    put('title', esc(name));
    put('sub', esc([txt(D.谁), txt(D.岗位), txt(D.业务)].filter(Boolean).join(' · ')));
    put('stamp', esc(stamp()));
    put('home', pageLink('首页.md', '在 Obsidian 里打开首页', 'home'));
    put('kpis', kpis());
    put('charts', blockChart() + rawChart() + dueChart(list));
    put('lists', todoCard(list) + '<div class="stack">' + askCard() + missCard() + '</div>' + recentCard());
    if (first) animate();
    first = false;
  }

  load(true);
  setInterval(function () { load(false); }, 30000);
})();
</script>
</body>
</html>
